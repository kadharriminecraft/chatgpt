    seen.set(realUrl, out);
    return out;
  }

  async function buildClassicSource(realUrl) {
    let src = await fetchWorkerScript(realUrl);
    /* pre-fetch literal importScripts(...) chains into __SWPRE.
       The shim resolves each argument against __SWCFG.url and looks
       the SERVICE form up in the map — sync fidelity for the
       standard top-of-worker pattern. */
    const pre = {};
    const seen = new Set([realUrl]);
    const queue = [realUrl];
    while (queue.length && Object.keys(pre).length < 24) {
      const base = queue.shift();
      let text;
      if (base === realUrl) text = src;
      else {
        try { text = await fetchWorkerScript(base); } catch (e) { continue; }
      }
      const re = /importScripts\s*\(\s*((?:['"][^'"]*['"]\s*,?\s*)+)\)/g;
      let m;
      while ((m = re.exec(text))) {
        const args = m[1].match(/['"]([^'"]+)['"]/g) || [];
        for (const a of args) {
          const spec = a.slice(1, -1);
          try {
            const abs = new URL(spec, base).href;
            if (!/^https?:\/\//i.test(abs) || seen.has(abs)) continue;
            seen.add(abs);
            const childText = await fetchWorkerScript(abs);
            pre[svcOf(abs)] = childText;
            queue.push(abs); /* nested importScripts */
          } catch (e) { }
        }
      }
    }
    if (Object.keys(pre).length) {
      src = 'self.__SWPRE=' + JSON.stringify(pre) + ';\n' + src;
    }
    return 'data:text/javascript;base64,' + stdB64(src);
  }

  /* v8.1: blob: URLs created inside the sandboxed page are unfetchable
     from the bridged worker (context-scoped). The worker's shim asks for
     the bytes; we relay the request to the page's hook (which keeps a
     registry of every createObjectURL payload) and route the reply back. */
  const blobReqs = new Map(); /* reqId → worker */

  function workerEvt(t, id, kind, data) {
    try {
      if (t && t.iframe && t.iframe.contentWindow) {
        t.iframe.contentWindow.postMessage({ __swwork: 1, id, kind, data }, '*');
      }
    } catch (e) { }
  }

  function makeWorkerFor(t, d) {
    const { id, url, module } = d;
    /* the bridge entry exists IMMEDIATELY with a pending queue — the
       page posts messages the instant `new Worker` returns, but the
       real worker takes hundreds of ms to build (script fetch + import
       inlining). Real browsers queue messages until the worker boots;
       the bridge must too, or every early postMessage is lost. */
    const wb = { worker: null, tabId: t.id, queue: [], dead: false };
    workerBridges.set(id, wb);
    (async () => {
      let realUrl = decodeSvcUrl(url) || (/^https?:\/\//i.test(url) ? url : null);
      if (!realUrl) throw new Error('invalid worker URL');
      const dataUrl = module
        ? await buildModuleDataUrl(realUrl, 0, new Map())
        : await buildClassicSource(realUrl);
      const w = new Worker(dataUrl, module ? { type: 'module' } : undefined);
      if (wb.dead) { try { w.terminate(); } catch (eD) { } return; }
      wb.worker = w;
      w.onmessage = (e) => {
        const md = e.data;
        if (md && typeof md === 'object' && md.__swblobget === 1 && md.req) {
          /* blob bytes request from the shim — forward to the page's hook */
          blobReqs.set(md.req, w);
          try {
            if (t && t.iframe && t.iframe.contentWindow) {
              t.iframe.contentWindow.postMessage({ __swblobget: 1, url: md.url, req: md.req }, '*');
            }
          } catch (eB) { }
          return;
        }
        workerEvt(t, id, 'message', e.data);
      };
      w.onmessageerror = () => workerEvt(t, id, 'messageerror', null);
      w.onerror = (e) => { workerEvt(t, id, 'error', {
        message: e.message || 'Worker error', filename: e.filename || '', lineno: e.lineno || 0
      }); };
      /* flush everything the page sent while the worker was building */
      for (const q of wb.queue) {
        try { w.postMessage(q); } catch (eQ) { }
      }
      wb.queue = [];
    })().catch((err) => {
      workerBridges.delete(id);
      workerEvt(t, id, 'error', { message: String((err && err.message) || err).slice(0, 200) });
    });
  }

  function navigate(input, opts) {
    const t = tab();
    if (!t) return;
    opts = opts || {};
    const dest = resolveInput(input);
    if (!dest) return;

    if (dest.internal) {
      /* internal pseudo-URL: superwork://settings etc. — recorded
         as a history entry so the back button returns to whatever
         was on screen before */
      t.hist = (t.hist || []).slice(0, (t.hidx == null ? -1 : t.hidx) + 1);
      t.hist.push({ internal: dest.internal, title: dest.internal });
      t.hidx = t.hist.length - 1;
      t.kind = 'internal'; t.internal = dest.internal; t.url = null;
      t.iframe = null; t.viewEl.innerHTML = '';
      populateTab(t);
      syncOmnibox(); renderTabs(); updateNavState(); persistTabs();
      return;
    }

    if (opts.newTab) { newTab({ url: dest.url }); return; }

    loadTab(t, { url: dest.url, push: true });
  }

  /* what "New Tab" means — the built-in search bar, or (setting)
     the selected search engine's own website, loaded through the
     proxy like any other page */
  function newTabPage() {
    if ((settings().openWith || 'newtab') === 'engine') {
      const eng = currentEngine();
      const home = eng.home || (eng.url || '').split('?')[0];
      if (home && /^https?:\/\//i.test(home)) return { url: home };
    }
    return {};
  }

  /* ---------------- omnibox input resolution ---------------- */
  function isUrlLike(s) {
    s = (s || '').trim();
    if (!s) return false;
    if (/^(https?|superwork):/i.test(s)) return true;
    if (s.startsWith('localhost') || s.startsWith('localhost:')) return true;
    const firstSeg = s.split('/')[0].split('?')[0].split('#')[0];
    if (/^\d{1,3}(\.\d{1,3}){3}(:\d+)?$/.test(firstSeg)) return true;
    if (/\s/.test(s) || !s.includes('.')) return false;
    return /^[a-z0-9-]+(\.[a-z0-9-]+)+(:\d+)?$/i.test(firstSeg);
  }
  function resolveInput(input) {
    const s = (input || '').trim();
    if (!s) return null;
    const internal = /^superwork:\/\/([a-z]+)/i.exec(s);
    if (internal) {
      const page = internal[1].toLowerCase();
      if (['newtab', 'settings', 'history', 'bookmarks'].includes(page)) return { internal: page };
    }
    let url;
    if (isUrlLike(s)) {
      url = /^https?:/i.test(s) ? s : (/^[a-z]+:\/\//i.test(s) ? s : 'https://' + s);
      try { return { url: new URL(url).href }; } catch (e) { return null; }
    }
    const eng = currentEngine();
    /* v6: the omnibox ALWAYS opens the results page — the
       "frontpage vs results" setting now controls what loads when
       the app opens / a new tab is created (see newTabPage) */
    return { url: eng.url.replace('%s', encodeURIComponent(s)) };
  }

  /* ============================================================
     Rendering: tab strip
     ============================================================ */
  function renderTabs() {
    const wrap = $('#tabs');
    wrap.innerHTML = '';
    tabs.forEach(t => {
      const b = el('button', 'tab' + (t.id === activeId ? ' active' : ''));
      b.type = 'button';
      b.title = t.title || t.url || 'New Tab';
      const ico = el('span', 't-ico');
      if (t.kind === 'web') {
        const img = document.createElement('img');
        img.alt = '';
        img.src = t.favicon || faviconFor(t.url);
        img.loading = 'lazy';
        img.onerror = () => { img.src = ICON; };
        ico.appendChild(img);
      } else {
        ico.appendChild(svgIcon(t.internal === 'settings' ? ICONS.settings :
          t.internal === 'history' ? ICONS.history :
            t.internal === 'bookmarks' ? ICONS.bookmark : ICONS.globe, 14));
      }
      const title = el('span', 't-title');
      title.textContent = t.title || (t.kind === 'web' ? t.url : 'New Tab');
      const x = el('span', 't-close');
      x.appendChild(svgIcon(ICONS.close));
      x.title = 'Close tab';
      b.append(ico, title, x);
      b.addEventListener('click', (e) => {
        if (x.contains(e.target) || e.target === x) return;
        activateTab(t.id);
      });
      x.addEventListener('click', (e) => { e.stopPropagation(); closeTab(t.id); });
      b.addEventListener('auxclick', (e) => { if (e.button === 1) closeTab(t.id); });
      wrap.appendChild(b);
    });
    $('#tg-count').textContent = tabs.length + (tabs.length === 1 ? ' tab' : ' tabs');
    updateTabsBadge();
  }

  /* ============================================================
     Omnibox
     ============================================================ */
  const omni = $('#omnibox-input');
  let omniState = { open: false, items: [], sel: -1, ctrl: null };

  function displayUrlFor(t) {
    if (!t) return '';
    if (t.kind === 'internal') {
      return 'superwork://' + (t.internal || 'newtab');
    }
    return t.url || '';
  }
  function syncOmnibox() {
    const t = tab();
    const box = $('#omnibox');
    if (document.activeElement === omni) return;
    omni.value = displayUrlFor(t);
    omni.placeholder = 'Search ' + currentEngine().name + ' or type URL';
    const isWeb = t && t.kind === 'web';
    box.classList.toggle('secure', !!(isWeb && /^https:/i.test(t.url || '')));
    box.classList.toggle('search', !isWeb);
    updateStar();
  }
  function updateStar() {
    const t = tab();
    const starred = !!(t && t.url && loadJSON(LS.bookmarks, []).some(b => b.url === t.url));
    $('#omni-star').classList.toggle('starred', starred);
  }

  /* ----- suggestions ----- */
  async function fetchSuggest(q) {
    const eng = currentEngine();
    if (!eng.suggest || !q) return [];
    const url = eng.suggest.replace('%s', encodeURIComponent(q));
    try {
      const res = await fetch(svc(encUrl(url)));
      if (!res.ok) return [];
      const ct = (res.headers.get('content-type') || '').toLowerCase();
      if (ct.indexOf('json') < 0 && ct.indexOf('javascript') < 0 && ct.indexOf('text') !== 0) return [];
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch (e) { return []; }
      let out = [];
      if (Array.isArray(data)) {
        const arr = Array.isArray(data[1]) ? data[1] : [];
        out = arr.map(x => typeof x === 'string' ? x :
          (x && (x.phrase || x.suggestion || (typeof x === 'object' && x.k))) || '');
      } else if (data && Array.isArray(data.suggestions)) {
        out = data.suggestions.map(x => typeof x === 'string' ? x : (x && x.phrase) || '');
      } else if (data && Array.isArray(data.r)) {
        out = data.r.map(x => x && x.k).filter(Boolean);
      }
      return out.filter(s => typeof s === 'string' && s && s.length < 90).slice(0, 5);
    } catch (e) { return []; }
  }

  function historyMatches(q) {
    const hist = loadJSON(LS.history, []);
    const ql = q.toLowerCase();
    const seen = new Set();
    const out = [];
    for (let i = hist.length - 1; i >= 0 && out.length < 3; i--) {
      const h = hist[i];
      if (!h.url || !h.url.startsWith('http')) continue;
      if (ql && (h.url.toLowerCase().includes(ql) || (h.title || '').toLowerCase().includes(ql))) {
        if (seen.has(h.url)) continue;
        seen.add(h.url);
        out.push({ url: h.url, title: h.title || h.url });
      }
    }
    return out;
  }

  function buildSuggestItems(q) {
    const items = [];
    const eng = currentEngine();
    if (isUrlLike(q) || /^https?:\/\//i.test(q)) {
      items.push({ kind: 'url', text: q, run: () => navigate(q) });
    } else if (q) {
      items.push({ kind: 'search', text: q, engine: eng.name, run: () => navigate(q) });
    }
    historyMatches(q).forEach(h => items.push({ kind: 'history', text: h.title, url: h.url, run: () => navigate(h.url) }));
    return items;
  }

  function renderSuggest(dynamic) {
    const box = $('#suggest');
    const q = omni.value.trim();
    const items = omniState.items;
    if (!q || (!items.length && !omniState.pending)) { box.hidden = true; omniState.open = false; return; }
    box.innerHTML = '';
    items.forEach((it, i) => {
      const row = el('button', 'sg' + (i === omniState.sel ? ' sel' : ''));
      row.type = 'button';
      const ico = el('span', 'sg-ico');
      if (it.kind === 'search') {
        const img = document.createElement('img');
        img.src = ICON; img.alt = '';
        ico.appendChild(img);
      } else {
        ico.appendChild(svgIcon(it.kind === 'url' ? ICONS.globe : ICONS.history, 16));
      }
      const text = el('span', 'sg-text');
      const bold = omni.value.trim();
      let label = it.text;
      if (it.kind === 'search' && it.suggestText) label = it.suggestText;
      text.innerHTML = '';
      const tnode = document.createElement('span');
      tnode.textContent = label;
      text.appendChild(tnode);
      const kind = el('span', 'sg-kind');
      kind.textContent = it.kind === 'search' ? (it.engine ? 'Search ' + it.engine : 'Search') :
        it.kind === 'url' ? 'Visit' : (it.url || '').replace(/^https?:\/\//, '').split('/')[0];
      row.append(ico, text, kind);
      row.addEventListener('click', () => { omniState.sel = i; commitSuggest(); });
      box.appendChild(row);
    });
    if (omniState.pending) {
      const p = el('div', 'sg');
      p.style.opacity = '.5';
      p.textContent = '…';
      box.appendChild(p);
    }
    box.hidden = false;
    omniState.open = true;
  }

  function commitSuggest() {
    const it = omniState.items[omniState.sel];
    omni.blur();
    closeSuggest();
    if (it) it.run(); else navigate(omni.value);
  }
  function closeSuggest() {
    $('#suggest').hidden = true;
    omniState.open = false;
    omniState.sel = -1;
    if (omniState.ctrl) { try { omniState.ctrl.abort(); } catch (e) { } omniState.ctrl = null; }
  }

  let suggestTimer = null;
  omni.addEventListener('input', () => {
    $('#omni-clear').hidden = !omni.value;
    clearTimeout(suggestTimer);
    const q = omni.value.trim();
    omniState.items = buildSuggestItems(q);
    omniState.sel = omniState.items.length ? 0 : -1;
    renderSuggest();
    if (!q) return;
    suggestTimer = setTimeout(async () => {
      const eng = currentEngine();
      if (!eng.suggest) return;
      omniState.pending = true;
      renderSuggest();
      const ctrl = new AbortController();
      omniState.ctrl = ctrl;
      const sug = await fetchSuggest(q);
      omniState.pending = false;
      if (ctrl.signal.aborted || omni.value.trim() !== q || document.activeElement !== omni) return;
      /* merge engine suggestions below the primary search row */
      const base = buildSuggestItems(q);
      const existing = new Set(base.map(b => b.text));
      sug.forEach(s => {
        if (!existing.has(s)) base.splice(base.length > 0 ? 1 : 0, 0, { kind: 'search', text: s, suggestText: s, engine: eng.name, run: () => navigate(s) });
      });
      omniState.items = base.slice(0, 8);
      omniState.sel = omniState.items.length ? 0 : -1;
      renderSuggest();
    }, 130);
  });
  omni.addEventListener('focus', () => {
    $('#omnibox').classList.add('focused');
    omni.select();
    const q = omni.value.trim();
    omniState.items = buildSuggestItems(q || '');
    omniState.sel = 0;
    renderSuggest();
  });
  omni.addEventListener('blur', () => {
    setTimeout(() => {
      $('#omnibox').classList.remove('focused');
      closeSuggest();
      syncOmnibox();
    }, 140);
  });
  omni.addEventListener('keydown', (e) => {
    const n = omniState.items.length;
    if (e.key === 'ArrowDown' && n) {
      e.preventDefault();
      omniState.sel = (omniState.sel + 1) % n;
      renderSuggest();
    } else if (e.key === 'ArrowUp' && n) {
      e.preventDefault();
      omniState.sel = (omniState.sel <= 0 ? n - 1 : omniState.sel - 1);
      renderSuggest();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      commitSuggest();
    } else if (e.key === 'Escape') {
      omni.blur();
      closeSuggest();
    }
  });
  $('#omni-clear').addEventListener('click', () => { omni.value = ''; omni.focus(); $('#omni-clear').hidden = true; });
  $('#omni-star').addEventListener('click', toggleBookmark);

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#omnibox')) closeSuggest();
    if (!e.target.closest('#menu') && !e.target.closest('#btn-menu')) hideMenu();
  });

  /* ============================================================
     Bookmarks / history
     ============================================================ */
  function toggleBookmark() {
    const t = tab();
    if (!t || t.kind !== 'web' || !t.url) return;
    let bms = loadJSON(LS.bookmarks, []);
    const i = bms.findIndex(b => b.url === t.url);
    if (i >= 0) { bms.splice(i, 1); toast('Bookmark removed'); }
    else { bms.push({ url: t.url, title: t.title || t.url, favicon: t.favicon, ts: Date.now() }); toast('Bookmark added'); }
    saveJSON(LS.bookmarks, bms);
    updateStar();
  }

  let lastNav = { url: '', ts: 0 };
  function recordHistory(t) {
    if (!t || !t.url || !t.url.startsWith('http')) return;
    const now = Date.now();
    if (t.url === lastNav.url && now - lastNav.ts < 8000) { lastNav.ts = now; return; }
    lastNav = { url: t.url, ts: now };
    let hist = loadJSON(LS.history, []);
    if (hist.length && hist[hist.length - 1].url === t.url) { hist[hist.length - 1].ts = now; }
    else {
      hist.push({ url: t.url, title: t.title || t.url, favicon: t.favicon, ts: now });
      if (hist.length > 2000) hist = hist.slice(-2000);
    }
    saveJSON(LS.history, hist);
  }

  /* ============================================================
     Progress + navigation state
     ============================================================ */
  const progressTimers = {};
  function startProgress(id) {
    const bar = $('#progressbar');
    bar.classList.remove('done'); bar.classList.add('loading');
    bar.querySelector('i').style.width = '12%';
    clearTimeout(progressTimers[id]);
    progressTimers[id] = setTimeout(() => { bar.querySelector('i').style.width = '68%'; }, 400);
  }
  function stopProgress(id) {
    clearTimeout(progressTimers[id]);
    const bar = $('#progressbar');
    const i = bar.querySelector('i');
    i.style.width = '100%';
    setTimeout(() => { bar.classList.remove('loading'); bar.classList.add('done'); }, 220);
  }

  function updateNavState() {
    const t = tab();
    const web = !!(t && t.kind === 'web' && t.url);
    $('#btn-reload').disabled = !web;
    $('#btn-home').hidden = !settings().showHome;
    renderTabs();
  }

  /* back/forward inside the iframe's own session history — via the
     hook command channel (works cross-origin; direct access throws) */
  function frameWin(t) {
    try { return t && t.iframe && t.iframe.contentWindow; } catch (e) { return null; }
  }
  function frameCmd(t, msg) {
    const w = frameWin(t);
    if (!w) return;
    try { w.postMessage(Object.assign({ __swcmd: 1 }, msg), '*'); } catch (e) { }
  }
  /* back/forward: first ask the in-page hook (SPA history lives
     there); if it is already at a page-load boundary it replies
     histBack/histFwd and the app walks its own per-tab stack.
     A short fallback timer covers hooks that cannot answer. */
  function navCmd(t, cmd, dir) {
    if (!t || t.kind !== 'web') return;
    if (!t.iframe) { goHistory(t, dir); return; }   /* error pages etc. */
    startProgress(t.id);
    frameCmd(t, { cmd: cmd });
    clearTimeout(t._navT);
    t._navReplied = false;
    t._navT = setTimeout(() => {
      if (!t._navReplied) { t._navReplied = true; goHistory(t, dir); }
    }, 350);
  }
  /* ============================================================
     Phone back button (v6) — the on-screen back/forward buttons
     are gone; the system/browser back gesture drives the app
     instead. A guard entry is kept at the tip of the joint
     history, so every popstate is one back press. Each press is
     consumed by, in order: the tab grid, the menu, the find bar,
     open suggestions, dialogs, then the active tab's history
     (in-page SPA states first, then page loads, then internal
     pages). When nothing can consume it, the app offers "press
     back again to exit".
     (The page iframes are re-created on every load, so the
     browser's per-iframe history entries are always dead and get
     skipped in the same traversal — the guard stays the tip.)
     ============================================================ */
  let guardArmed = false;
  let guardSeq = 0;
  let rearmTimer = null;
  function armBackGuard() {
    clearTimeout(rearmTimer);
    try {
      history.pushState({ __swguard: ++guardSeq }, '');
      guardArmed = true;
    } catch (e) {
      /* engines that refuse pushState on this scheme — hash
         entries still produce a popstate on back */
      try { location.hash = '#sw' + (++guardSeq); guardArmed = true; }
      catch (e2) { guardArmed = false; }
    }
  }
  function closeTopOverlay() {
    const grid = $('#tabgrid');
    if (grid && !grid.hidden) { grid.hidden = true; return true; }
    const menu = $('#menu');
    if (menu && !menu.hidden) { hideMenu(); return true; }
    const find = $('#findbar');
    if (find && !find.hidden) { closeFind(); return true; }
    const dlg = $('#dlg');
    if (dlg && dlg.open) { try { $('#dlg-cancel').click(); } catch (e) { } return true; }
    if (omniState && omniState.open) { try { omni.blur(); } catch (e) { } closeSuggest(); return true; }
    return false;
  }
  function consumeBackPress() {
    if (closeTopOverlay()) return true;
    const t = tab();
    if (!t) return false;
    const stackBack = !!(t.hist && t.hidx != null && t.hidx > 0);
    if (t.kind !== 'web' || !t.url) {
      /* internal page — back follows the tab history (returns to
         whatever was on screen before Settings/History/…) */
      if (stackBack) { goHistory(t, -1); return true; }
      return false;
    }
    if (t.hookCanBack || stackBack) { navCmd(t, 'back', -1); return true; }
    return false;
  }
  window.addEventListener('popstate', () => {
    if (!guardArmed) { armBackGuard(); return; }
    if (consumeBackPress()) {
      armBackGuard();
    } else {
      guardArmed = false;
      toast('Press back again to exit');
      clearTimeout(rearmTimer);
      rearmTimer = setTimeout(armBackGuard, 1800);
    }
  });

  $('#btn-reload').addEventListener('click', () => reloadTab());
  $('#btn-home').addEventListener('click', () => goHome());
  $('#newtab-btn').addEventListener('click', () => newTab(newTabPage()));
  $('#btn-tabs').addEventListener('click', () => openTabGrid());

  function reloadTab() {
    const t = tab();
    if (!t) return;
    if (t.kind === 'web' && t.url) {
      startProgress(t.id);
      loadTab(t, { url: t.url, push: false });
    } else {
      t.viewEl.innerHTML = '';
      populateTab(t);
    }
  }
  function goHome() {
    const hp = (settings().homepage || '').trim();
    if (hp && /^https?:\/\//i.test(hp)) navigate(hp);
    else navigate('superwork://newtab');
  }

  /* ============================================================
     Messages from proxied pages (hook.js) — the only channel the
     pages have. Every navigation arrives here and is performed by
     the app's fetch + srcdoc pipeline.
     ============================================================ */
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.__sw !== 1) return;
    /* map source window → tab */
    let t = null;
    for (const x of tabs) {
      if (x.iframe && x.iframe.contentWindow === e.source) { t = x; break; }
    }
    if (!t) return;
    switch (d.type) {
      case 'nav': {
        t._navReplied = true; clearTimeout(t._navT);
        if (d.phase === 'start') {
          if (t.awaitHello) {
            /* the handshake from the srcdoc we injected */
            t.awaitHello = false;
            t.escapes = 0;
          } else if (d.url && /^https?:\/\//i.test(d.url) && d.url !== t.url) {
            /* a second handshake = the frame escaped into a proxied
               page by direct navigation — recover it properly */
            loadTab(t, { url: d.url });
            return;
          }
        }
        const url = d.url || '';
        if (/^https?:\/\//i.test(url)) {
          t.url = url;
          t.kind = 'web';
          if (d.title) t.title = d.title;
          if (d.favicon) t.favicon = d.favicon;
          t.hookCanBack = !!d.canBack;
          t.hookCanFwd = !!d.canFwd;
          if (t.hist && t.hidx != null && t.hist[t.hidx]) {
            t.hist[t.hidx] = { url: t.url, title: d.title || t.url };
          }
          if (d.phase === 'load') { t.loaded = true; stopProgress(t.id); recordHistory(t); }
        }
        syncOmnibox(); updateNavState();
        break;
      }
      case 'meta':
        if (d.title) t.title = d.title;
        if (d.favicon) t.favicon = d.favicon;
        renderTabs(); syncOmnibox();
        break;
      case 'navigate':
        if (d.url && /^https?:\/\//i.test(d.url)) loadTab(t, { url: d.url, push: !d.replace });
        break;
      case 'submit': {
        /* form POST — the app performs the fetch with the body
           (entries arrive as plain arrays: sandboxed frames cannot
           postMessage FormData/URLSearchParams objects) */
        const url = d.url;
        if (!url || !/^https?:\/\//i.test(url)) break;
        if (d.multipart) {
          const fd = new FormData();
          (d.fields || []).forEach(p => { try { fd.append(p[0], p[1]); } catch (e) { } });
          Promise.all((d.files || []).map(f =>
            fetch(f.b64).then(r => r.blob()).then(b => { fd.append(f.k, b, f.name || 'file'); })
          )).catch(() => { }).then(() => {
            startProgress(t.id);
            loadTab(t, { url, push: true, method: 'POST', body: fd });
          });
        } else {
          startProgress(t.id);
          loadTab(t, { url, push: true, method: 'POST', body: new URLSearchParams(d.fields || []) });
        }
        break;
      }
      case 'openTab':
        if (d.url && /^https?:\/\//i.test(d.url)) newTab({ url: d.url });
        break;
      case 'download':
        /* download request relayed by the hook (a[download], data:, blob:) */
        if (d.dataUrl) downloadFromDataUrl(d.dataUrl, d.filename || '');
        else if (d.url && /^https?:\/\//i.test(d.url)) startDownload(d.url, { filename: d.filename || '' });
        else if (d.failed) toast('The page\u2019s download could not be read');
        break;
      case 'closeRequest':
        closeTab(t.id);
        break;
      case 'reloadRequest':
        if (t.kind === 'web' && t.url) { startProgress(t.id); loadTab(t, { url: t.url, push: false }); }
        break;
      case 'histBack':
        t._navReplied = true; clearTimeout(t._navT);
        goHistory(t, -1);
        break;
      case 'histFwd':
        t._navReplied = true; clearTimeout(t._navT);
        goHistory(t, 1);
        break;
      case 'setCookie':
        /* script-set cookie from a proxied page — persist + push to the worker */
        if (d.url && d.cookie) { jarAdd(d.url, d.cookie); queueJarSync(); }
        break;
      case 'swStore':
        /* storage write relayed from a sandboxed frame */
        if (d.tag && d.origin && typeof d.key === 'string') {
          const base = 'sw:' + d.tag + ':' + d.origin + ':';
          try {
            if (d.val == null) localStorage.removeItem(base + d.key);
            else localStorage.setItem(base + d.key, String(d.val));
          } catch (err) { }
          if (d.tag === 'ss') {
            memSS[d.origin] = memSS[d.origin] || {};
            if (d.val == null) delete memSS[d.origin][d.key];
            else memSS[d.origin][d.key] = String(d.val);
          }
        }
        break;
      case 'swClear':
        if (d.tag && d.origin) {
          const base = 'sw:' + d.tag + ':' + d.origin + ':';
          try {
            const kill = [];
            for (let i = 0; i < localStorage.length; i++) {
              const k = localStorage.key(i);
              if (k && k.indexOf(base) === 0) kill.push(k);
            }
            kill.forEach(k => localStorage.removeItem(k));
          } catch (err) { }
          if (d.tag === 'ss') delete memSS[d.origin];
        }
        break;
      case 'findResult':
        $('#find-count').textContent = (d.cur + 1) + '/' + Math.max(d.total, 0);
        break;
      case 'childLoad':
        /* v7: an adopted child frame finished loading — its joint
           history entry may sit above the back guard; re-arm so the
           next back press lands on the guard, not the child entry */
        armBackGuard();
        break;
      /* v8: Worker bridge — the sandboxed page cannot construct
         workers (opaque origin); we build real data:-URL workers in
         the app context and bridge messages both ways */
      case 'makeWorker':
        if (d.id && d.url) makeWorkerFor(t, d);
        break;
      case 'workerMsg': {
        const wb = workerBridges.get(d.id);
        if (wb) {
          if (wb.worker) {
            try { wb.worker.postMessage(d.data); }
            catch (e) { }
          } else if (!wb.dead) {
            /* worker still building — queue until it boots (browser semantics) */
            wb.queue.push(d.data);
          }
        }
        break;
      }
      case 'workerTerminate': {
        const wb2 = workerBridges.get(d.id);
        if (wb2) {
          wb2.dead = true;
          if (wb2.worker) { try { wb2.worker.terminate(); } catch (e) { } }
          wb2.queue = [];
          workerBridges.delete(d.id);
        }
        break;
      }
      case '__swblob': {
        /* v8.1: blob-bytes reply from the page's hook — route to the
           requesting worker (correlated by req id) */
        if (d.__swblobgot === 1 && d.req) {
          const bw = blobReqs.get(d.req);
          if (bw) {
            blobReqs.delete(d.req);
            const payload = { __swblobgot: 1, req: d.req, mime: d.mime, fail: d.fail };
            if (d.buf instanceof ArrayBuffer) {
              payload.buf = d.buf;
              try { bw.postMessage(payload, [d.buf]); } catch (e) { try { bw.postMessage(payload); } catch (e2) { } }
            } else {
              try { bw.postMessage(payload); } catch (e) { }
            }
          }
        }
        break;
      }
      case 'pageLog':
        /* v8: console.warn relay from pages — surfaced for debugging */
        try { console.log('[superwork:page]', d.msg || ''); } catch (e) { }
        break;
      case 'pageError':
        /* surfaced for debugging — console keeps a trace per tab */
        try {
          console.warn('[superwork:page]', d.msg, d.src ? (d.src + ':' + d.line) : '', d.ctx || '');
          if (d.stack) console.warn('[superwork:page:stack]', d.stack);
        } catch (e) { }
        break;
    }
  });

  /* ============================================================
     Menu
     ============================================================ */
  function hideMenu() { $('#menu').hidden = true; }
  /* v7: zoom controls inside the 3-dots menu */
  function buildZoomRow() {
    const row = el('div', 'mzoom');
    row.appendChild(el('span', 'mzoom-lab', 'Zoom'));
    const ctl = el('div', 'mzoom-ctl');
    const minus = el('button', 'mzoom-btn', '\u2212');
    minus.type = 'button'; minus.title = 'Zoom out';
    const val = el('span', 'mzoom-val', Math.round(getZoom() * 100) + '%');
    const plus = el('button', 'mzoom-btn', '+');
    plus.type = 'button'; plus.title = 'Zoom in';
    ctl.append(minus, val, plus);
    const reset = el('button', 'mzoom-reset', 'Reset');
    reset.type = 'button';
    row.append(ctl, reset);
    const upd = () => { val.textContent = Math.round(getZoom() * 100) + '%'; };
    minus.addEventListener('click', (e) => { e.stopPropagation(); setZoom(getZoom() - 0.1); upd(); });
    plus.addEventListener('click', (e) => { e.stopPropagation(); setZoom(getZoom() + 0.1); upd(); });
    reset.addEventListener('click', (e) => { e.stopPropagation(); setZoom(1); upd(); });
    return row;
  }
  function showMenu() {
    const t = tab();
    const m = $('#menu');
    const isWeb = t && t.kind === 'web';
    const desktop = isWeb && isDesktopHost(t.url);
    const items = [
      { icon: ICONS.tab, label: 'New tab', run: () => newTab(newTabPage()) },
      { icon: ICONS.history, label: 'History', run: () => navigate('superwork://history') },
      { icon: ICONS.bookmark, label: 'Bookmarks', run: () => navigate('superwork://bookmarks') },
      { sep: true },
      { icon: ICONS.find, label: 'Find in page', run: () => openFind(), hide: !isWeb },
      { icon: ICONS.desktop, label: 'Desktop site', check: desktop, run: () => toggleDesktop(t), hide: !isWeb },
      { node: buildZoomRow(), hide: !isWeb },
      ...(navigator.share ? [{ icon: ICONS.share, label: 'Share…', run: () => sharePage(t), hide: !isWeb }] : []),
      { sep: true },
      { icon: ICONS.settings, label: 'Settings', run: () => navigate('superwork://settings') },
      { icon: ICONS.close, label: 'Close tab', run: () => closeTab(activeId) },
    ].filter(x => !x.hide);

    m.innerHTML = '';
    items.forEach(it => {
      if (it.sep) { m.appendChild(el('div', 'msep')); return; }
      if (it.node) { m.appendChild(it.node); return; }
      const b = el('button', 'mi' + (it.check ? ' on' : ''));
      b.type = 'button';
      b.appendChild(svgIcon(it.icon, 18));
      const lab = el('span', '', it.label);
      b.appendChild(lab);
      if (it.check) b.appendChild(svgIcon(ICONS.check, 16)).classList.add('mi-check');
      b.addEventListener('click', () => { hideMenu(); it.run(); });
      m.appendChild(b);
    });
    m.hidden = false;
  }
  $('#btn-menu').addEventListener('click', (e) => {
    e.stopPropagation();
    if ($('#menu').hidden) showMenu(); else hideMenu();
  });

  function isDesktopHost(url) {
    try {
      const host = new URL(url).hostname;
      return desktopHosts().includes(host);
    } catch (e) { return false; }
  }
  function toggleDesktop(t) {
    if (!t || !t.url) return;
    let host = '';
    try { host = new URL(t.url).hostname; } catch (e) { return; }
    const list = desktopHosts().filter(Boolean);
    const i = list.indexOf(host);
    if (i >= 0) list.splice(i, 1); else list.push(host);
    try { localStorage.setItem(LS_DSK, JSON.stringify(list)); } catch (e) { }
    syncJar(); /* push the new UA list to the worker */
    toast(i >= 0 ? 'Desktop site off for ' + host : 'Desktop site on for ' + host);
    reloadTab();
  }

  async function sharePage(t) {
    try {
      await navigator.share({ title: t.title || '', url: t.url });
    } catch (e) { }
  }

  /* ============================================================
     Find in page — executed inside the page by hook.js, so it works
     in both engine modes (the UI never needs DOM access to the
     proxied document, which is impossible cross-origin).
     ============================================================ */
  function openFind() {
    $('#findbar').hidden = false;
    $('#find-input').value = '';
    $('#find-count').textContent = '0/0';
    $('#find-input').focus();
  }
  function closeFind() {
    $('#findbar').hidden = true;
    frameCmd(tab(), { cmd: 'findClear' });
  }
  function runFind(q, dir) {
    const t = tab();
    if (!t || !t.iframe) return;
    frameCmd(t, { cmd: 'find', q: String(q || '') });
    /* direction is applied after the result arrives via findResult */
    if (dir < 0) pendingFindDir = -1;
  }
  let pendingFindDir = 1;
  let findTimer = null;
  $('#find-input').addEventListener('input', () => {
    clearTimeout(findTimer);
    findTimer = setTimeout(() => runFind($('#find-input').value, 1), 220);
  });
  $('#find-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      frameCmd(tab(), { cmd: e.shiftKey ? 'findPrev' : 'findNext' });
    }
    if (e.key === 'Escape') closeFind();
  });
  $('#find-next').addEventListener('click', () => frameCmd(tab(), { cmd: 'findNext' }));
  $('#find-prev').addEventListener('click', () => frameCmd(tab(), { cmd: 'findPrev' }));
  $('#find-close').addEventListener('click', closeFind);

  function renderInternal(t, root) {
    switch (t.internal) {
      case 'settings': return renderSettings(root);
      case 'history': return renderHistory(root);
      case 'bookmarks': return renderBookmarks(root);
      default: return renderNewTab(root);
    }

  /* ---------------- New Tab ---------------- */
  function renderNewTab(root) {
    const eng = currentEngine();
    const wrap = el('div', 'nt-wrap');
    const logo = el('img', 'nt-logo');
    logo.src = ICON; logo.alt = 'Superwork';
    wrap.appendChild(logo);

    const search = el('div', 'nt-search');
    const sIco = svgIcon(ICONS.search, 20);
    const input = el('input');
    input.type = 'text';
    input.placeholder = 'Search ' + eng.name + ' or type a URL';
    input.spellcheck = false;
    const engTag = el('span', 'nt-engine', eng.name);
    search.append(sIco, input, engTag);
    search.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); if (input.value.trim()) { input.blur(); navigate(input.value.trim()); } }
    });
    wrap.appendChild(search);

    const grid = el('div', 'nt-links');
    const links = loadJSON(LS.links, null) || DEFAULT_LINKS.slice();
    links.forEach(l => grid.appendChild(quickLink(l)));
    const add = el('button', 'ql ql-add');
    add.innerHTML = '<img src="' + ICON + '" alt=""><span>Add</span>';
    add.addEventListener('click', () => promptAddLink());
    grid.appendChild(add);
    wrap.appendChild(grid);

    if (!loadJSON(LS.welcome, false)) {
      const note = el('div', 'nt-note');
      note.innerHTML = '<b>Welcome to Superwork</b> — a real proxy engine, so pages load fully, buttons work and sites behave natively. ' +
        'Pick your default search engine in <a href="superwork://settings">Settings</a>.';
      const dismiss = el('button', 'btn-line', 'Got it');
      dismiss.style.marginTop = '10px';
      dismiss.addEventListener('click', () => { saveJSON(LS.welcome, true); note.remove(); });
      note.appendChild(dismiss);
      wrap.appendChild(note);
    }
    root.appendChild(wrap);
    setTimeout(() => input.focus(), 60);
  }

  function quickLink(l) {
    const b = el('button', 'ql');
    const img = document.createElement('img');
    img.src = faviconFor(l.u); img.alt = '';
    img.loading = 'lazy';
    img.onerror = () => { img.src = ICON; };
    const s = el('span', '', l.t);
    b.append(img, s);
    const x = el('span', 'ql-x', '✕');
    x.title = 'Remove';
    x.addEventListener('click', (e) => {
      e.stopPropagation();
      const links = loadJSON(LS.links, null) || DEFAULT_LINKS.slice();
      saveJSON(LS.links, links.filter(k => k.u !== l.u));
      b.remove();
    });
    b.appendChild(x);
    b.addEventListener('click', () => navigate(l.u));
    return b;
  }

  function promptAddLink(presetUrl, presetTitle) {
    dialog('Add shortcut', [
      { label: 'Name', id: 'f-name', value: presetTitle || '' },
      { label: 'URL', id: 'f-url', value: presetUrl || 'https://' }
    ], (vals) => {
      let u = (vals['f-url'] || '').trim();
      if (!u) return;
      if (!/^https?:\/\//i.test(u) && !isUrlLike(u)) return;
      if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      const links = loadJSON(LS.links, null) || DEFAULT_LINKS.slice();
      if (links.some(k => k.u === u)) { toast('Already added'); return; }
      links.push({ t: (vals['f-name'] || '').trim() || u.replace(/^https?:\/\//, '').split('/')[0], u });
      saveJSON(LS.links, links);
      const t = tab();
      if (t && t.internal === 'newtab') { t.viewEl.innerHTML = ''; populateTab(t); }
    });
  }

        clrRow.appendChild(clr);
        dlsec.appendChild(clrRow);
        dlsec.appendChild(el('div', 'set-desc',
          'Keeps the last ' + DL_MAX + ' files. Every download is also saved to your device\u2019s Downloads the moment it finishes.'));
      }
    }
    wrap.appendChild(dlsec);

    /* --- Appearance --- */
    const ap = el('div', 'set-sec');
    ap.appendChild(el('h4', '', 'Appearance'));
    ap.appendChild(toggleRow('Dark theme follows your system by default.', 'Theme', 'theme', [
      ['system', 'System'], ['light', 'Light'], ['dark', 'Dark']
    ], s.theme, (v) => saveSettings({ theme: v })));
    ap.appendChild(boolRow('Show home button', 'Adds a home button next to the address bar.', s.showHome, (v) => saveSettings({ showHome: v })));
    ap.appendChild(toggleRow(
      'Show tabs in a strip on top, or hide the strip and switch tabs with a button (like mobile Chrome).',
      'Tab switcher', 'tabUi',
      [['strip', 'Tab strip (top)'], ['button', 'Tabs button']],
      s.tabUi || 'strip', (v) => saveSettings({ tabUi: v })));
    wrap.appendChild(ap);

    /* --- General --- */
    const gen = el('div', 'set-sec');
    gen.appendChild(el('h4', '', 'General'));
    const hpRow = el('div', 'set-row');
    const hpBox = el('div', 'grow');
    hpBox.appendChild(el('div', 't', 'Homepage'));
    hpBox.appendChild(el('div', 's', 'Opened by the home button (blank = New Tab page).'));
    const hpInput = el('input', 'set-input');
    hpInput.type = 'text'; hpInput.value = s.homepage || ''; hpInput.placeholder = 'https://…';
    hpInput.style.width = 'min(300px, 60vw)';
    hpInput.addEventListener('change', () => saveSettings({ homepage: hpInput.value.trim() }));
    hpRow.append(hpBox, hpInput);
    gen.appendChild(hpRow);
    gen.appendChild(boolRow('Block ads & trackers', 'Faster pages, less clutter. Blocks a built-in list of ~300 known ad/tracker hosts.', s.blockAds, (v) => {
      saveSettings({ blockAds: v });
      syncJar();
    }));
    gen.appendChild(boolRow('Continue where you left off', 'Restore your open tabs when Superwork starts.', s.startup === 'restore', (v) => saveSettings({ startup: v ? 'restore' : 'newtab' })));
    wrap.appendChild(gen);

    /* --- Privacy --- */
    const priv = el('div', 'set-sec');
    priv.appendChild(el('h4', '', 'Privacy'));
    const cRow = el('div', 'set-row');
    cRow.appendChild(el('div', 'grow', '<div class="t">Site data &amp; cookies</div><div class="s">Clears proxy cookies and per-site storage (logs you out of proxied sites).</div>'));
    const cBtn = el('button', 'btn-danger', 'Clear');
    cBtn.addEventListener('click', () => {
      confirmDlg('Clear site data?', 'This signs you out of all proxied sites.', () => {
        try { localStorage.removeItem(LS_JAR); } catch (e) { }
        syncJar({ clear: true, cookies: [] });
        clearSiteStorage();
        toast('Site data cleared');
      });
    });
    cRow.appendChild(cBtn);
    priv.appendChild(cRow);
    const hRow = el('div', 'set-row');
    hRow.appendChild(el('div', 'grow', '<div class="t">Browsing history</div><div class="s">Clears the history recorded in Superwork.</div>'));
    const hBtn = el('button', 'btn-danger', 'Clear');
    hBtn.addEventListener('click', () => confirmDlg('Clear history?', 'This cannot be undone.', () => {
      saveJSON(LS.history, []); toast('History cleared');
      if (tab() && tab().internal === 'history') { tab().viewEl.innerHTML = ''; populateTab(tab()); }
    }));
    hRow.appendChild(hBtn);
    priv.appendChild(hRow);
    wrap.appendChild(priv);

    /* --- About --- */
    const about = el('div', 'set-sec');
    about.appendChild(el('h4', '', 'About'));
    const aRow = el('div', 'set-row');
    aRow.appendChild(el('div', 'grow',
      '<div class="t">Superwork ' + APP_VERSION + '</div>' +
      '<div class="s">A modern rebuild of kadharriminecraft/Superwork (Relay). ' +
      'Backend: your own Cloudflare Worker (pure API proxy) — everything runs on it.</div>'));
    const ping = el('button', 'btn-line', 'Check connection');
    ping.addEventListener('click', async () => {
      ping.textContent = 'Checking…';
      const j = await testWorker(WORKER || location.origin);
      ping.textContent = j ? ('Connected' + (j.colo ? ' · ' + j.colo : '') + ' · v' + j.version) : 'Worker unreachable';
    });
    aRow.appendChild(ping);
    about.appendChild(aRow);
    wrap.appendChild(about);

    if (wrap !== root) root.appendChild(wrap);
  }

  function toggleRow(desc, label, key, options, value, onChange) {
    const row = el('div', 'set-row');
    const box = el('div', 'grow');
    box.appendChild(el('div', 't', label));
    box.appendChild(el('div', 's', desc));
    const sel = el('select', 'set-select');
    options.forEach(([v, name]) => {
      const o = el('option', '', name);
      o.value = v;
      if (v === value) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', () => onChange(sel.value));
    row.append(box, sel);
    return row;
  }
  function boolRow(title, desc, value, onChange) {
    const row = el('div', 'set-row');
    const box = el('div', 'grow');
    box.appendChild(el('div', 't', title));
    box.appendChild(el('div', 's', desc));
    const sw = el('label', 'switch');
    const input = el('input');
    input.type = 'checkbox'; input.checked = !!value;
    input.addEventListener('change', () => onChange(input.checked));
    sw.append(input, el('i'));
    row.append(box, sw);
    return row;
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ---------------- History ---------------- */
  function renderHistory(root) {
    const wrap = settingsRoot(root);
    wrap.innerHTML = '';
    wrap.appendChild(el('h1', 'set-h', 'History'));
    const bar = el('div', 'list-search');
    bar.appendChild(svgIcon(ICONS.search, 18));
    const input = el('input');
    input.type = 'text'; input.placeholder = 'Search history'; input.spellcheck = false;
    bar.appendChild(input);
    const clearBtn = el('button', 'btn-danger', 'Clear all');
    clearBtn.style.marginLeft = '10px';
    clearBtn.addEventListener('click', () => confirmDlg('Clear history?', 'This cannot be undone.', () => {
      saveJSON(LS.history, []);
      renderHistory(wrap);
    }));
    bar.appendChild(clearBtn);
    wrap.appendChild(bar);

    const listWrap = el('div');
    wrap.appendChild(listWrap);
    const draw = () => {
      listWrap.innerHTML = '';
      const q = input.value.trim().toLowerCase();
      const hist = loadJSON(LS.history, []).slice().reverse()
        .filter(h => !q || (h.url || '').toLowerCase().includes(q) || (h.title || '').toLowerCase().includes(q));
      if (!hist.length) { listWrap.appendChild(el('div', 'empty-note', 'No history yet.')); return; }
      const groups = new Map();
      hist.forEach(h => {
        const day = new Date(h.ts).toDateString();
        if (!groups.has(day)) groups.set(day, []);
        groups.get(day).push(h);
      });
      groups.forEach((items, day) => {
        const g = el('div', 'hgroup');
        g.appendChild(el('div', 'hday', day));
        items.forEach(h => {
          const row = el('button', 'hrow');
          row.type = 'button';
          const img = document.createElement('img');
          img.src = h.favicon || faviconFor(h.url); img.alt = '';
          img.loading = 'lazy';
          img.onerror = () => { img.src = ICON; };
          const time = el('span', 'h-time', new Date(h.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
          const title = el('span', 'h-title', h.title || h.url);
          const url = el('span', 'h-url', h.url || '');
          const x = el('span', 'h-x', '');
          x.appendChild(svgIcon(ICONS.close, 14));
          row.append(img, time, title, url, x);
          row.addEventListener('click', (e) => {
            if (x.contains(e.target)) return;
            navigate(h.url);
          });
          x.addEventListener('click', (e) => {
            e.stopPropagation();
            saveJSON(LS.history, loadJSON(LS.history, []).filter(k => k.ts !== h.ts || k.url !== h.url));
            draw();
          });
          g.appendChild(row);
        });
        listWrap.appendChild(g);
      });
    };
    input.addEventListener('input', draw);
    draw();
    if (wrap !== root) root.appendChild(wrap);
  }

  /* ---------------- Bookmarks ---------------- */
  function renderBookmarks(root) {
    const wrap = settingsRoot(root);
    wrap.innerHTML = '';
    const h = el('h1', 'set-h', 'Bookmarks');
    h.innerHTML = 'Bookmarks <span class="bm-star">★</span>';
    wrap.appendChild(h);
    const bms = loadJSON(LS.bookmarks, []);
    if (!bms.length) {
      wrap.appendChild(el('div', 'empty-note', 'No bookmarks yet — tap the ☆ in the address bar.'));
      if (wrap !== root) root.appendChild(wrap);
      return;
    }
    const list = el('div', 'hgroup');
    bms.slice().reverse().forEach(b => {
      const row = el('button', 'hrow');
      row.type = 'button';
      const img = document.createElement('img');
      img.src = b.favicon || faviconFor(b.url); img.alt = '';
      img.loading = 'lazy';
      img.onerror = () => { img.src = ICON; };
      const title = el('span', 'h-title', b.title || b.url);
      const url = el('span', 'h-url', b.url);
      const x = el('span', 'h-x', '');
      x.appendChild(svgIcon(ICONS.close, 14));
      row.append(img, title, url, x);
      row.addEventListener('click', (e) => {
        if (x.contains(e.target)) return;
        navigate(b.url);
      });
      x.addEventListener('click', (e) => {
        e.stopPropagation();
        saveJSON(LS.bookmarks, loadJSON(LS.bookmarks, []).filter(k => k.url !== b.url));
        renderBookmarks(wrap);
      });
      list.appendChild(row);
    });
    wrap.appendChild(list);
    if (wrap !== root) root.appendChild(wrap);
  }

  /* ============================================================
     Tab grid overlay (v6 — simple 2-column grid: each cell has an
     X in its top-right, a larger + sits top-right of the header,
     with a Close-all button beside it)
     ============================================================ */
  function openTabGrid() {
    const grid = $('#tabgrid');
    const list = $('#tg-list');
    list.innerHTML = '';
    tabs.forEach(t => {
      const card = el('button', 'tg-card' + (t.id === activeId ? ' sel' : ''));
      card.type = 'button';
      const head = el('div', 'tg-cell-head');
      const img = document.createElement('img');
      img.src = t.favicon || faviconFor(t.url || 'https://superwork') || ICON;
      img.alt = ''; img.loading = 'lazy';
      img.onerror = () => { img.src = ICON; };
      const title = el('span', 'tg-cell-title', t.title || 'New Tab');
      const x = el('span', 'tg-x');
      x.title = 'Close tab';
      x.appendChild(svgIcon(ICONS.close, 17));
      head.append(img, title, x);
      const thumb = el('div', 'tg-thumb');
      const big = document.createElement('img');
      big.src = img.src; big.alt = '';
      big.onerror = () => { big.src = ICON; };
      thumb.appendChild(big);
      let host = 'New Tab';
      try { if (t.url) host = new URL(t.url).hostname; } catch (e) { }
      thumb.appendChild(el('span', 'tg-host', host));
      card.append(head, thumb);
      card.addEventListener('click', (e) => {
        if (x.contains(e.target)) return;
        grid.hidden = true;
        activateTab(t.id);
      });
      x.addEventListener('click', (e) => {
        e.stopPropagation();
        closeTab(t.id);
        if (!tabs.length) grid.hidden = true;
        else openTabGrid();
      });
      list.appendChild(card);
    });
    $('#tg-count').textContent = tabs.length + (tabs.length === 1 ? ' tab' : ' tabs');
    grid.hidden = false;
  }
  $('#tg-new').addEventListener('click', () => { $('#tabgrid').hidden = true; newTab(newTabPage()); });
  $('#tg-close-all').addEventListener('click', () => {
    [...tabs].forEach(t => closeTab(t.id));
    $('#tabgrid').hidden = true;
  });

  /* ============================================================
     Dialogs & toast
     ============================================================ */
  function dialog(title, fields, onOk) {
    const dlg = $('#dlg');
    $('#dlg-title').textContent = title;
    const body = $('#dlg-body');
    body.innerHTML = '';
    const inputs = {};
    fields.forEach(f => {
      const lab = el('label', '', f.label);
      const inp = el('input');
      inp.type = 'text'; inp.value = f.value || ''; inp.id = f.id;
      inputs[f.id] = inp;
      lab.appendChild(inp);
      body.appendChild(lab);
    });
    dlg.showModal();
    setTimeout(() => (fields[0] && inputs[fields[0].id] || {}).focus && inputs[fields[0].id].focus(), 50);
    const ok = $('#dlg-ok'), cancel = $('#dlg-cancel');
    const done = (okd) => {
      dlg.close();
      ok.removeEventListener('click', okH);
      cancel.removeEventListener('click', cancelH);
      if (okd) {
        const vals = {};
        fields.forEach(f => vals[f.id] = inputs[f.id].value);
        onOk(vals);
      }
    };
    function okH() { done(true); }
    function cancelH() { done(false); }
    ok.addEventListener('click', okH);
    cancel.addEventListener('click', cancelH);
    body.addEventListener('keydown', (e) => { if (e.key === 'Enter') done(true); });
  }
  function confirmDlg(title, text, onOk) {
    const dlg = $('#dlg');
    $('#dlg-title').textContent = title;
    $('#dlg-body').innerHTML = '<p>' + esc(text) + '</p>';
    dlg.showModal();
    const ok = $('#dlg-ok'), cancel = $('#dlg-cancel');
    const done = (okd) => {
      dlg.close();
      ok.removeEventListener('click', okH);
      cancel.removeEventListener('click', cancelH);
      if (okd) onOk();
    };
    function okH() { done(true); }
    function cancelH() { done(false); }
    ok.addEventListener('click', okH);
    cancel.addEventListener('click', cancelH);
  }
  let toastTimer = null;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
  }

  /* ============================================================
     Site storage clearing (app-side: prefixed localStorage keys)
     ============================================================ */
  function clearSiteStorage() {
    try {
      const kill = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('sw:')) kill.push(k);
      }
      kill.forEach(k => localStorage.removeItem(k));
    } catch (e) { }
    if (indexedDB.databases) {
      indexedDB.databases().then(dbs => {
        (dbs || []).forEach(d => {
          if (d.name && (d.name.startsWith('sw_') || d.name.startsWith('superwork-sw'))) {
            indexedDB.deleteDatabase(d.name);
          }
        });
      }).catch(() => { });
    }
  }

  /* ============================================================
     Theme / chrome toggles / persistence
     ============================================================ */
  function applyTheme() {
    const s = settings();
    document.documentElement.dataset.theme = s.theme;
    let meta = document.querySelector('meta[name=theme-color]');
    if (!meta) {
      meta = document.createElement('meta');
      meta.name = 'theme-color';
      document.head.appendChild(meta);
    }
    const dark = s.theme === 'dark' || (s.theme === 'system' &&
      matchMedia('(prefers-color-scheme: dark)').matches);
    meta.content = dark ? '#202124' : '#ffffff';
  }
  function applyChromeToggles() {
    const s = settings();
    $('#btn-home').hidden = !s.showHome;
    const app = $('#app');
    if (app) app.dataset.tabui = s.tabUi || 'strip';
    $('#btn-tabs').hidden = (s.tabUi || 'strip') !== 'button';
    updateTabsBadge();
  }
  function updateTabsBadge() {
    const b = $('#tabs-badge');
    if (b) b.textContent = String(tabs.length);
  }

  /* ============================================================
     Page zoom (v7) — a quick scale control in the 3-dots menu.
     Applied to every page iframe via CSS `zoom` (Chromium reflows
     the layout at the scaled viewport, exactly like browser zoom),
     with a transform+width fallback for engines without it.
     Persisted in settings; new frames pick it up automatically.
     ============================================================ */
  let ZOOM_SUPPORTED = null;
  function zoomSupported() {
    if (ZOOM_SUPPORTED !== null) return ZOOM_SUPPORTED;
    try { ZOOM_SUPPORTED = !!(CSS.supports && CSS.supports('zoom', '1.25')); }
    catch (e) { ZOOM_SUPPORTED = false; }
    return ZOOM_SUPPORTED;
  }
  function getZoom() {
    const z = Number(settings().zoom);
    return (isFinite(z) && z >= 0.5 && z <= 2) ? z : 1;
  }
  function applyZoomToFrame(f, z) {
    try {
      if (zoomSupported()) {
        f.style.zoom = (z === 1) ? '' : String(z);
        f.style.transform = '';
        f.style.width = '';
        f.style.height = '';
        f.style.transformOrigin = '';
      } else if (z === 1) {
        f.style.zoom = '';
        f.style.transform = '';
        f.style.width = '';
        f.style.height = '';
        f.style.transformOrigin = '';
      } else {
        f.style.zoom = '';
        f.style.transformOrigin = '0 0';
        f.style.transform = 'scale(' + z + ')';
        f.style.width = (100 / z) + '%';
        f.style.height = (100 / z) + '%';
      }
    } catch (e) { }
  }
  function applyZoomAll() {
    const z = getZoom();
    tabs.forEach(t => { if (t.iframe) applyZoomToFrame(t.iframe, z); });
  }
  function setZoom(z) {
    z = Math.min(2, Math.max(0.5, Math.round(z * 10) / 10));
    saveSettings({ zoom: z });
    applyZoomAll();
    return z;
  }
  function persistTabs() {
    const data = tabs.map(t => ({
      url: t.url, internal: t.internal, kind: t.kind, title: t.title, favicon: t.favicon
    }));
    saveJSON(LS.tabs, { tabs: data, active: tabs.findIndex(t => t.id === activeId) });
  }

  /* ============================================================
     Keyboard shortcuts (Chrome-like)
     ============================================================ */
  document.addEventListener('keydown', (e) => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key === 't') { e.preventDefault(); newTab(newTabPage()); }
    else if (mod && e.key === 'w') { e.preventDefault(); closeTab(activeId); }
    else if (mod && e.shiftKey && e.key.toLowerCase() === 't') {
      e.preventDefault();
      const last = closedStack.pop();
      if (last) newTab(last.url ? { url: last.url } : { internal: last.internal });
    }
    else if ((mod && e.key === 'l') || (e.altKey && e.key === 'd')) { e.preventDefault(); omni.focus(); omni.select(); }
    else if (mod && e.key === 'r') { e.preventDefault(); reloadTab(); }
    else if (e.key === 'F5') { e.preventDefault(); reloadTab(); }
    else if (mod && e.key === 'f') { e.preventDefault(); openFind(); }
    else if (mod && e.key === 'd') { e.preventDefault(); toggleBookmark(); }
    else if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); navCmd(tab(), 'back', -1); }
    else if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); navCmd(tab(), 'fwd', 1); }
    else if (e.key === 'Escape') { closeTopOverlay(); }
    else if (mod && e.key === 'Tab') {
      e.preventDefault();
      if (tabs.length > 1) {
        const i = tabs.findIndex(t => t.id === activeId);
        activateTab(tabs[(i + (e.shiftKey ? -1 : 1) + tabs.length) % tabs.length].id);
      }
    }
  });

  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

  /* ============================================================
     Boot
     ============================================================ */
  async function boot() {
    applyTheme();
    applyChromeToggles();

    /* restore session if requested */
    const s = settings();
    let restored = false;
    if (s.startup === 'restore') {
      const sess = loadJSON(LS.tabs, null);
      if (sess && Array.isArray(sess.tabs) && sess.tabs.length) {
        sess.tabs.forEach((t, i) => {
          const opts = t.kind === 'web' && t.url
            ? { url: t.url, title: t.title, favicon: t.favicon, lazy: i !== sess.active }
            : { internal: t.internal || 'newtab', lazy: i !== sess.active };
          newTab(opts);
        });
        restored = true;
        /* v6: "open with the engine website" — if the restored
           session has no real pages open, start on the engine site
           instead of a bare New Tab */
        if ((s.openWith || 'newtab') === 'engine' && !tabs.some(x => x.kind === 'web' && x.url)) {
          tabs.forEach(x => { try { x.viewEl.remove(); } catch (e) { } });
          tabs = []; activeId = null;
          restored = false;
        }
      }
    }
    if (!restored) newTab(newTabPage());
  }

  /* ============================================================
     Bootstrap — connect to the configured worker (first run
     shows the setup screen), then start the browser.
     ============================================================ */
  function startApp() {
    boot();
    /* v6: the phone back button drives in-app navigation */
    armBackGuard();
    /* v6: open the downloads store (IndexedDB when available) */
    dlIdbInit();
    if (WORKER) {
      /* keep the worker's jar warm and absorb server-set cookies */
      syncJar();
      setInterval(() => syncJar(), 45000);
    }
  }

  function showSetup() {
    const setup = $('#setup');
    if (!setup) { boot(); return; }
    setup.hidden = false;
    const input = $('#setup-url');
    const btn = $('#setup-connect');
    const msg = $('#setup-msg');
    const logo = $('#setup-logo');
    if (logo) logo.src = ICON;
    const connect = async () => {
      const u = normalizeWorkerUrl(input.value);
      if (!u) { msg.textContent = 'Enter your worker URL.'; return; }
      btn.disabled = true; btn.textContent = 'Connecting…'; msg.textContent = '';
      const j = await testWorker(u);
      btn.disabled = false; btn.textContent = 'Connect';
      if (j) {
        try { localStorage.setItem(LS_WORKER, u); } catch (e) { }
        WORKER = u;
        setup.hidden = true;
        toast('Connected');
        startApp();
      } else {
        msg.textContent = 'Could not reach that worker. Check the URL and that it is deployed.';
      }
    };
    btn.addEventListener('click', connect);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });
    setTimeout(() => input.focus(), 80);
  }

  {
    const w = savedWorker();
    if (w) {
      testWorker(w).then(j => {
        if (j) { WORKER = w; startApp(); }
        else showSetup();
      });
    } else {
      showSetup();
    }
  }

  /* clean up super-stale history once a day */
  try {
    const last = localStorage.getItem('superwork:lastTrim');
    if (!last || Date.now() - Number(last) > 864e5) {
      localStorage.setItem('superwork:lastTrim', String(Date.now()));
      let hist = loadJSON(LS.history, []);
      if (hist.length > 2000) saveJSON(LS.history, hist.slice(-2000));
    }
  } catch (e) { }
})();


</script>

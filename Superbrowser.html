<title>Superwork</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20128%20128%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%230fa895%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230b8f7e%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20x%3D%226%22%20y%3D%226%22%20width%3D%22116%22%20height%3D%22116%22%20rx%3D%2228%22%20fill%3D%22url(%23g)%22%2F%3E%3Cpath%20d%3D%22M84.5%2045.8c-3.2-6.4-10.9-11-20.5-11-13%200-23%207.9-23%2019.2%200%2010.6%208.4%2016.3%2020.9%2019.5%2010.6%202.7%2014.2%205.2%2014.2%2010%200%205.4-5%208.9-12.6%208.9-8.2%200-14.9-3.6-18.3-10.4L32%2089.6c4.4%208.7%2013.6%2014.6%2026.2%2014.6h2.6c14.5%200%2025.3-7.8%2025.3-20.6%200-11.4-8.1-17-21.9-20.7-11.6-3.1-13.9-5.6-13.9-9.6%200-4.4%204.4-7.4%2011.3-7.4%206.6%200%2011.8%202.9%2014.7%208.3z%22%20fill%3D%22%23ffffff%22%2F%3E%3C%2Fsvg%3E">
<style>
/* ============================================================
   Superwork 4.0 — Chrome-style UI
   Light + dark themes · tab strip + omnibox only at the top ·
   nothing at the bottom.
   ============================================================ */
:root {
  --tab-h: 40px;
  --tool-h: 48px;
  --tab-bg: #dee1e6;
  --tab-fg: #3c4043;
  --tab-active-bg: #ffffff;
  --tab-active-fg: #202124;
  --tab-hover: rgba(255,255,255,.35);
  --chrome-bg: #ffffff;
  --chrome-fg: #202124;
  --omni-bg: #f1f3f4;
  --omni-bg-focus: #ffffff;
  --omni-fg: #202124;
  --omni-sub: #5f6368;
  --btn-fg: #5f6368;
  --btn-hover: rgba(0,0,0,.06);
  --border: #dadce0;
  --page-bg: #ffffff;
  --page-fg: #202124;
  --menu-bg: #ffffff;
  --menu-fg: #202124;
  --menu-hover: #f1f3f4;
  --accent: #0b8f7e;
  --accent-fg: #ffffff;
  --danger: #d93025;
  --shadow: 0 1px 3px rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
  --card: #ffffff;
  --field: #f1f3f4;
  --link: #1a73e8;
  --scroll: #c1c1c1;
}
[data-theme="dark"] {
  --tab-bg: #35363a;
  --tab-fg: #e8eaed;
  --tab-active-bg: #292a2d;
  --tab-active-fg: #e8eaed;
  --tab-hover: rgba(255,255,255,.08);
  --chrome-bg: #292a2d;
  --chrome-fg: #e8eaed;
  --omni-bg: #202124;
  --omni-bg-focus: #202124;
  --omni-fg: #e8eaed;
  --omni-sub: #9aa0a6;
  --btn-fg: #e8eaed;
  --btn-hover: rgba(255,255,255,.1);
  --border: #5f6368;
  --page-bg: #202124;
  --page-fg: #e8eaed;
  --menu-bg: #292a2d;
  --menu-fg: #e8eaed;
  --menu-hover: #35363a;
  --shadow: 0 1px 3px rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.3);
  --card: #292a2d;
  --field: #35363a;
  --link: #8ab4f8;
  --scroll: #5f6368;
}
@media (prefers-color-scheme: dark) {
  [data-theme="system"] {
    --tab-bg: #35363a; --tab-fg: #e8eaed; --tab-active-bg: #292a2d; --tab-active-fg: #e8eaed;
    --tab-hover: rgba(255,255,255,.08); --chrome-bg: #292a2d; --chrome-fg: #e8eaed;
    --omni-bg: #202124; --omni-bg-focus: #202124; --omni-fg: #e8eaed; --omni-sub: #9aa0a6;
    --btn-fg: #e8eaed; --btn-hover: rgba(255,255,255,.1); --border: #5f6368;
    --page-bg: #202124; --page-fg: #e8eaed; --menu-bg: #292a2d; --menu-fg: #e8eaed;
    --menu-hover: #35363a; --shadow: 0 1px 3px rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.3);
    --card: #292a2d; --field: #35363a; --link: #8ab4f8; --scroll: #5f6368;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
  font-size: 14px; overflow: hidden; background: var(--page-bg); color: var(--page-fg);
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
svg { display: block; fill: currentColor; pointer-events: none; }
[hidden] { display: none !important; }

#app { height: 100dvh; display: flex; flex-direction: column; }

/* ============ Header: tab strip + toolbar ============ */
#browser { flex: 0 0 auto; position: relative; z-index: 40; }
#tabstrip {
  height: var(--tab-h); background: var(--tab-bg);
  display: flex; align-items: flex-end; padding: 6px 6px 0 8px; gap: 4px;
  padding-left: max(8px, env(safe-area-inset-left));
}
/* mobile-Chrome mode: no strip, a tabs button in the toolbar instead */
#app[data-tabui="button"] #tabstrip { display: none; }
#app[data-tabui="button"] #menu { top: calc(var(--tool-h) - 4px); }
#app[data-tabui="button"] #findbar { top: var(--tool-h); }
#btn-tabs { position: relative; }
#tabs-badge {
  position: absolute; top: 2px; right: 2px; min-width: 17px; height: 17px;
  border-radius: 9px; background: var(--accent); color: #fff;
  font-size: 10.5px; font-weight: 600; display: grid; place-items: center;
  padding: 0 4px; line-height: 1; pointer-events: none;
}
#tabs {
  display: flex; align-items: flex-end; gap: 2px; flex: 1; min-width: 0;
  overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
}
#tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1 0 60px; max-width: 240px; min-width: 56px; height: 34px;
  display: flex; align-items: center; gap: 6px; padding: 0 6px 0 10px;
  background: transparent; color: var(--tab-fg); border-radius: 8px 8px 0 0;
  cursor: default; user-select: none; position: relative; transition: background .12s;
}
.tab:hover { background: var(--tab-hover); }
.tab.active { background: var(--tab-active-bg); color: var(--tab-active-fg); }
.tab .t-ico { width: 16px; height: 16px; flex: 0 0 auto; border-radius: 2px; }
.tab .t-ico img { width: 16px; height: 16px; display: block; }
.tab .t-title {
  flex: 1; min-width: 0; font-size: 12px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; text-align: left; line-height: 34px;
}
.tab .t-close {
  width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
  flex: 0 0 auto; opacity: .75;
}
.tab .t-close:hover { background: rgba(0,0,0,.12); opacity: 1; }
[data-theme="dark"] .tab .t-close:hover { background: rgba(255,255,255,.15); }
.tab .t-close svg { width: 12px; height: 12px; }
.strip-btn {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  color: var(--tab-fg); margin-bottom: 3px; flex: 0 0 auto;
}
.strip-btn:hover { background: var(--tab-hover); }
.strip-btn svg { width: 16px; height: 16px; }

#toolbar {
  height: var(--tool-h); background: var(--chrome-bg); color: var(--chrome-fg);
  display: flex; align-items: center; gap: 2px; padding: 0 4px;
  padding-left: max(4px, env(safe-area-inset-left));
  padding-right: max(4px, env(safe-area-inset-right));
}
.tb-btn {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  color: var(--btn-fg); flex: 0 0 auto;
}
.tb-btn:hover:not(:disabled) { background: var(--btn-hover); }
.tb-btn:disabled { opacity: .3; pointer-events: none; }
.tb-btn svg { width: 20px; height: 20px; }

/* ============ Omnibox ============ */
#omnibox {
  flex: 1; min-width: 0; height: 38px; position: relative;
  background: var(--omni-bg); border-radius: 20px;
  display: flex; align-items: center; gap: 6px; padding: 0 4px 0 12px;
  transition: background .15s, box-shadow .15s;
}
#omnibox.focused { background: var(--omni-bg-focus); box-shadow: 0 1px 6px rgba(32,33,36,.28); }
#omni-left { display: flex; align-items: center; flex: 0 0 auto; color: var(--omni-sub); }
#omni-lock, #omni-search { width: 16px; height: 16px; display: none; }
#omnibox.secure #omni-lock { display: block; }
#omnibox.search #omni-search { display: block; }
#omnibox-input {
  flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent;
  font-size: 15px; color: var(--omni-fg); font-family: inherit;
}
#omnibox-input::placeholder { color: var(--omni-sub); }
#omni-clear, #omni-star {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  color: var(--omni-sub); flex: 0 0 auto;
}
#omni-clear svg, #omni-star svg { width: 16px; height: 16px; }
#omni-clear:hover, #omni-star:hover { background: var(--btn-hover); }
#omni-star.starred { color: #f9ab00; }

/* Suggestions dropdown */
#suggest {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 60;
  background: var(--menu-bg); color: var(--menu-fg); border-radius: 8px;
  box-shadow: var(--shadow); overflow: hidden; padding: 4px 0; max-height: 380px; overflow-y: auto;
}
.sg {
  display: flex; align-items: center; gap: 12px; padding: 8px 16px; cursor: default;
  white-space: nowrap; overflow: hidden; text-align: left; width: 100%;
}
.sg:hover, .sg.sel { background: var(--menu-hover); }
.sg .sg-ico { width: 16px; height: 16px; flex: 0 0 auto; display: grid; place-items: center; color: var(--omni-sub); }
.sg .sg-ico svg, .sg .sg-ico img { width: 16px; height: 16px; }
.sg .sg-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.sg .sg-text b { font-weight: 600; }
.sg .sg-kind { flex: 0 0 auto; font-size: 12px; color: var(--omni-sub); max-width: 40%; overflow: hidden; text-overflow: ellipsis; }

/* progress bar */
#progressbar { height: 2px; background: transparent; }
#progressbar i {
  display: block; height: 100%; width: 0; background: var(--accent);
  transition: width .25s ease, opacity .4s ease; opacity: 0;
}
#progressbar.loading i { opacity: 1; }
#progressbar.done i { opacity: 0; }

/* ============ Viewport ============ */
#viewport {
  flex: 1 1 auto; position: relative; background: var(--page-bg);
  min-height: 0; overflow: hidden;
}
.tab-view { position: absolute; inset: 0; display: none; }
.tab-view.active { display: block; }
.tab-view iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
.tab-view .internal {
  position: absolute; inset: 0; overflow-y: auto; background: var(--page-bg); color: var(--page-fg);
  -webkit-overflow-scrolling: touch;
}
.tab-view .internal::-webkit-scrollbar { width: 10px; }
.tab-view .internal::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 5px; }

/* ============ Menu ============ */
#menu {
  position: absolute; top: calc(var(--tab-h) + var(--tool-h) - 4px); right: 8px; z-index: 80;
  background: var(--menu-bg); color: var(--menu-fg); border-radius: 10px;
  box-shadow: var(--shadow); padding: 6px 0; min-width: 240px; max-height: calc(100dvh - 140px);
  overflow-y: auto; animation: pop .12s ease;
}
@keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; } }
.mi {
  display: flex; align-items: center; gap: 14px; width: 100%; padding: 10px 18px;
  font-size: 14px; text-align: left; color: inherit;
}
.mi:hover { background: var(--menu-hover); }
.mi svg { width: 18px; height: 18px; opacity: .8; }
.mi .mi-check { margin-left: auto; opacity: 0; color: var(--accent); }
.mi.on .mi-check { opacity: 1; }
.msep { height: 1px; background: var(--border); margin: 6px 0; opacity: .6; }
.mhead { padding: 8px 18px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--omni-sub); }

/* v7: zoom row in the 3-dots menu */
.mzoom {
  display: flex; align-items: center; gap: 8px; padding: 6px 18px;
  border-bottom: 1px solid var(--border); border-top: 1px solid var(--border);
  margin: 4px 0;
}
.mzoom-lab { font-size: 14px; color: inherit; }
.mzoom-ctl { display: flex; align-items: center; gap: 2px; margin-left: auto; }
.mzoom-btn {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  font-size: 19px; line-height: 1; color: inherit;
}
.mzoom-btn:hover { background: var(--menu-hover); }
.mzoom-val { min-width: 48px; text-align: center; font-size: 13px; color: var(--omni-sub); }
.mzoom-reset { color: var(--accent); font-size: 12.5px; padding: 7px 10px; border-radius: 14px; }
.mzoom-reset:hover { background: var(--menu-hover); }

/* ============ Find bar ============ */
#findbar {
  position: absolute; top: calc(var(--tab-h) + var(--tool-h)); right: 12px; z-index: 70;
  display: flex; align-items: center; gap: 4px; padding: 6px 8px;
  background: var(--menu-bg); border: 1px solid var(--border); border-top: 0;
  border-radius: 0 0 10px 10px; box-shadow: var(--shadow);
  animation: pop .12s ease; max-width: calc(100vw - 24px);
}
#find-input {
  height: 32px; width: 200px; max-width: 44vw; border: 0; outline: 0; background: transparent;
  color: var(--menu-fg); font-size: 14px;
}
#find-count { font-size: 12px; color: var(--omni-sub); min-width: 44px; text-align: center; }
#findbar button { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--omni-sub); }
#findbar button:hover { background: var(--menu-hover); }
#findbar button svg { width: 18px; height: 18px; }
mark.swf { background: #fff3a3; color: #202124; border-radius: 2px; }
mark.swf.cur { background: #ff9632; color: #202124; }

/* ============ Tab grid overlay (v6: simple 2-column grid) ============ */
#tabgrid {
  position: absolute; inset: 0; z-index: 90; background: var(--page-bg);
  display: flex; flex-direction: column; animation: fadein .15s ease;
}
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.tg-head {
  display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  padding-top: max(12px, env(safe-area-inset-top));
}
#tg-count { font-size: 17px; font-weight: 500; color: var(--page-fg); }
.tg-spacer { flex: 1; }
.tg-btn {
  padding: 9px 16px; border-radius: 18px; font-size: 13px; color: var(--accent);
  border: 1px solid var(--border);
}
.tg-btn:hover { background: var(--menu-hover); }
/* larger + button, top right */
.tg-new {
  width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: #fff; flex: 0 0 auto;
  box-shadow: 0 2px 8px rgba(0,0,0,.22);
}
.tg-new:active { transform: scale(.94); }
.tg-new svg { width: 26px; height: 26px; }
#tg-list {
  flex: 1; overflow-y: auto; display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px; padding: 6px 14px 24px; align-content: start;
}
.tg-card {
  border-radius: 14px; overflow: hidden; background: var(--card);
  box-shadow: 0 1px 4px rgba(0,0,0,.18); cursor: pointer; text-align: left;
  display: flex; flex-direction: column; min-width: 0;
}
.tg-card.sel { outline: 3px solid var(--accent); outline-offset: -3px; }
.tg-cell-head {
  display: flex; align-items: center; gap: 8px; padding: 8px 6px 8px 10px;
  border-bottom: 1px solid var(--border);
}
.tg-cell-head img { width: 18px; height: 18px; flex: 0 0 auto; border-radius: 3px; }
.tg-cell-title {
  flex: 1; min-width: 0; font-size: 12.5px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; color: var(--page-fg);
}
/* the X — top right of every cell, thumb-friendly */
.tg-x {
  width: 32px; height: 32px; border-radius: 50%; flex: 0 0 auto;
  display: grid; place-items: center; color: var(--omni-sub);
}
.tg-x svg { width: 17px; height: 17px; }
.tg-x:hover { background: var(--menu-hover); color: var(--danger, #d93025); }
.tg-thumb {
  height: 108px; background: var(--field); display: grid; place-items: center;
  color: var(--omni-sub); position: relative;
}
.tg-thumb img { width: 36px; height: 36px; }
.tg-thumb .tg-host {
  position: absolute; bottom: 8px; left: 0; right: 0; text-align: center;
  font-size: 11px; color: var(--omni-sub);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px;
}

/* ============ Downloads progress bar (v6) ============ */
#dlbar {
  position: fixed; left: 12px; bottom: max(12px, env(safe-area-inset-bottom));
  z-index: 300; display: flex; flex-direction: column; gap: 8px;
  width: min(320px, calc(100vw - 24px)); pointer-events: none;
}
.dl-card {
  pointer-events: auto; display: flex; align-items: center; gap: 10px;
  background: var(--card); border-radius: 12px; padding: 10px 12px;
  box-shadow: 0 4px 18px rgba(0,0,0,.28);
  border: 1px solid var(--border);
  animation: dl-in .18s ease;
}
@keyframes dl-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.dl-ico { width: 30px; height: 30px; border-radius: 8px; background: var(--field); display: grid; place-items: center; color: var(--accent); flex: 0 0 auto; }
.dl-ico svg { width: 18px; height: 18px; }
.dl-card.done .dl-ico { color: #1e8e3e; }
.dl-mid { flex: 1; min-width: 0; }
.dl-name { font-size: 12.5px; color: var(--page-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dl-sub { font-size: 11px; color: var(--omni-sub); margin-top: 2px; }
.dl-track { height: 3px; border-radius: 2px; background: var(--field); margin-top: 5px; overflow: hidden; }
.dl-track i { display: block; height: 100%; width: 0%; background: var(--accent); border-radius: 2px; transition: width .15s; }
.dl-x {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  color: var(--omni-sub); flex: 0 0 auto;
}
.dl-x:hover { background: var(--menu-hover); }
.dl-x svg { width: 15px; height: 15px; }
/* downloads list in Settings */
.dl-row-ico { width: 38px; height: 38px; border-radius: 10px; background: var(--field); display: grid; place-items: center; color: var(--accent); flex: 0 0 auto; }
.dl-row-ico svg { width: 20px; height: 20px; }
.dl-size { font-size: 11.5px; color: var(--omni-sub); margin-top: 2px; }
.dl-act { display: flex; gap: 8px; flex: 0 0 auto; }

/* ============ Dialog / toast ============ */
dialog {
  margin: auto; border: 0; border-radius: 14px; padding: 22px; min-width: 320px; max-width: 92vw;
  background: var(--card); color: var(--page-fg); box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(0,0,0,.45); }
#dlg h3 { font-size: 17px; font-weight: 500; margin-bottom: 16px; }
#dlg-body { font-size: 14px; line-height: 1.5; min-height: 20px; }
#dlg-body label { display: block; margin: 12px 0 6px; font-size: 12px; color: var(--omni-sub); text-transform: uppercase; letter-spacing: .04em; }
#dlg-body input[type=text] {
  width: 100%; height: 40px; border: 1px solid var(--border); border-radius: 8px;
  padding: 0 12px; font-size: 14px; background: var(--field); color: var(--page-fg); outline: none;
}
#dlg-body input[type=text]:focus { border-color: var(--accent); }
#dlg-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
.btn-primary {
  background: var(--accent); color: var(--accent-fg); border-radius: 18px;
  padding: 9px 20px; font-size: 13.5px; font-weight: 500;
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { border-radius: 18px; padding: 9px 20px; font-size: 13.5px; color: var(--accent); }
.btn-ghost:hover { background: var(--menu-hover); }

#toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 200;
  background: #323639; color: #e8eaed; padding: 12px 22px; border-radius: 8px;
  font-size: 13.5px; box-shadow: var(--shadow); animation: fadein .18s ease; max-width: 86vw; text-align: center;
}

/* ============ v7: Save-As prompt (activation re-acquisition) ============ */
.saveas {
  position: fixed; inset: 0; z-index: 900; background: rgba(0,0,0,.45);
  display: flex; align-items: center; justify-content: center;
  animation: fadein .15s ease; padding: 24px;
}
.saveas-card {
  width: min(400px, 92vw); background: var(--card); color: var(--page-fg);
  border-radius: 18px; padding: 26px 24px; text-align: center;
  box-shadow: 0 12px 48px rgba(0,0,0,.3);
}
.saveas-title { font-size: 17px; font-weight: 500; }
.saveas-name {
  font-size: 13px; color: var(--omni-sub); margin: 8px 0 2px;
  word-break: break-all; max-height: 60px; overflow: hidden;
}
.saveas-sub { font-size: 12.5px; color: var(--omni-sub); margin-bottom: 18px; line-height: 1.5; }
.saveas-btn { display: block; width: 100%; margin-top: 10px; padding: 12px; }

/* ============================================================
   Internal pages (new tab / settings / history / bookmarks)
   ============================================================ */
.nt-wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; padding: 9vh 20px 40px; }
.nt-logo { width: 68px; height: 68px; margin-bottom: 28px; }
.nt-search {
  display: flex; align-items: center; gap: 10px; width: min(560px, 92vw);
  height: 50px; border-radius: 25px; background: var(--field);
  padding: 0 18px; border: 1px solid transparent; transition: box-shadow .15s, background .15s;
}
.nt-search:focus-within { background: var(--card); box-shadow: 0 1px 10px rgba(32,33,36,.22); }
.nt-search svg { width: 20px; height: 20px; color: var(--omni-sub); flex: 0 0 auto; }
.nt-search input { flex: 1; height: 100%; border: 0; outline: 0; background: transparent; font-size: 15.5px; color: var(--page-fg); }
.nt-engine {
  flex: 0 0 auto; font-size: 12px; color: var(--omni-sub); display: flex; align-items: center; gap: 4px;
}
.nt-links { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; width: min(560px, 92vw); margin-top: 40px; }
.ql {
  display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 4px 10px;
  border-radius: 10px; position: relative; color: var(--page-fg);
}
.ql:hover { background: var(--field); }
.ql img { width: 32px; height: 32px; border-radius: 50%; background: var(--field); padding: 6px; }
.ql span { font-size: 12px; max-width: 90px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ql .ql-x {
  position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%;
  display: none; place-items: center; color: var(--omni-sub); background: var(--card);
}
.ql:hover .ql-x { display: grid; }
.ql-add { border: 1px dashed var(--border); color: var(--omni-sub); }
.nt-note { margin-top: 48px; font-size: 12.5px; color: var(--omni-sub); text-align: center; max-width: 480px; line-height: 1.6; }
.nt-note a { color: var(--link); }

/* Settings & list pages */
.set-wrap { max-width: 680px; margin: 0 auto; padding: 32px 22px 60px; }
.set-h { font-size: 22px; font-weight: 400; margin-bottom: 26px; color: var(--page-fg); }
.set-sec { margin-bottom: 30px; }
.set-sec h4 {
  font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em;
  color: var(--omni-sub); margin-bottom: 4px;
}
.set-desc { font-size: 12.5px; color: var(--omni-sub); margin-bottom: 14px; line-height: 1.5; }
.set-row {
  display: flex; align-items: center; gap: 14px; padding: 13px 4px;
  border-bottom: 1px solid var(--border); min-height: 52px;
}
.set-row:last-child { border-bottom: 0; }
.set-row .grow { flex: 1; min-width: 0; }
.set-row .t { font-size: 14px; }
.set-row .s { font-size: 12px; color: var(--omni-sub); margin-top: 2px; }
.radio-row { display: flex; align-items: center; gap: 14px; padding: 12px 4px; border-bottom: 1px solid var(--border); width: 100%; text-align: left; }
.radio-row input { width: 18px; height: 18px; accent-color: var(--accent); }
.radio-row .t { font-size: 14px; }
.radio-row .s { font-size: 12px; color: var(--omni-sub); margin-top: 1px; }
select.set-select, input.set-input {
  height: 38px; border: 1px solid var(--border); background: var(--field); color: var(--page-fg);
  border-radius: 8px; padding: 0 12px; font-size: 13.5px; outline: none; min-width: 130px;
}
.switch { position: relative; width: 44px; height: 24px; flex: 0 0 auto; }
.switch input { opacity: 0; width: 100%; height: 100%; position: absolute; cursor: pointer; z-index: 2; }
.switch i {
  position: absolute; inset: 0; background: var(--border); border-radius: 12px; transition: background .15s;
}
.switch i::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
  border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s;
}
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(20px); }
.btn-danger {
  color: var(--danger); border: 1px solid var(--danger); border-radius: 18px;
  padding: 8px 16px; font-size: 13px;
}
.btn-danger:hover { background: rgba(217,48,37,.08); }
.btn-line { color: var(--accent); border: 1px solid var(--border); border-radius: 18px; padding: 8px 16px; font-size: 13px; }
.btn-line:hover { background: var(--menu-hover); }

/* History / bookmark list */
.list-search {
  display: flex; align-items: center; gap: 10px; background: var(--field);
  border-radius: 10px; height: 44px; padding: 0 14px; margin-bottom: 18px;
}
.list-search svg { width: 18px; height: 18px; color: var(--omni-sub); }
.list-search input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 14px; color: var(--page-fg); }
.hgroup { margin-bottom: 20px; }
.hday { font-size: 13px; font-weight: 500; color: var(--omni-sub); margin-bottom: 6px; }
.hrow {
  display: flex; align-items: center; gap: 12px; padding: 9px 6px; border-radius: 8px;
  color: var(--page-fg); width: 100%; text-align: left;
}
.hrow:hover { background: var(--field); }
.hrow img { width: 16px; height: 16px; flex: 0 0 auto; }
.hrow .h-time { flex: 0 0 52px; font-size: 12px; color: var(--omni-sub); }
.hrow .h-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; }
.hrow .h-url { flex: 0 0 32%; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; color: var(--omni-sub); }
.hrow .h-x { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--omni-sub); flex: 0 0 auto; }
.hrow .h-x:hover { background: var(--btn-hover); color: var(--danger); }
.hrow .h-x svg { width: 14px; height: 14px; }
.empty-note { text-align: center; color: var(--omni-sub); padding: 60px 0; font-size: 14px; }
.bm-star { color: #f9ab00; }

/* find-in-page highlight inside proxied docs */
::selection { background: rgba(11,143,126,.25); }

/* ============ Chrome-style error page (in-app) ============ */
.err-wrap {
  min-height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 40px 26px;
  text-align: center;
}
.err-face { font-size: 58px; line-height: 1; color: var(--page-fg); margin-bottom: 22px; }
.err-h { font-size: 21px; font-weight: 400; color: var(--page-fg); margin-bottom: 14px; }
.err-p { font-size: 14.5px; line-height: 1.55; color: var(--omni-sub); max-width: 480px; margin-bottom: 8px; }
.err-detail { font-size: 12.5px; word-break: break-word; }
.err-code { font-size: 12.5px; color: var(--omni-sub); font-family: ui-monospace, Menlo, monospace; margin: 18px 0 22px; }
.err-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

/* ============ Responsive ============ */
@media (max-width: 600px) {
  :root { --tab-h: 38px; --tool-h: 52px; }
  .tab { flex: 1 0 44px; min-width: 40px; padding: 0 4px 0 7px; }
  .tab .t-title { font-size: 11px; }
  .tb-btn { width: 44px; height: 44px; }
  .tb-btn svg { width: 21px; height: 21px; }
  #btn-home { display: none !important; }
  .hrow .h-url { display: none; }
  #find-input { width: 130px; }
  .nt-logo { width: 56px; height: 56px; margin-bottom: 20px; }
}
@media (min-width: 601px) {
  #tg-btn { display: none; }
}
/* tabs button is primarily a phone feature — hide it on wide screens
   unless the user explicitly picked button mode */
@media (min-width: 601px) {
  #app:not([data-tabui="button"]) #btn-tabs { display: none; }
}

/* ============ First-run setup ============ */
#setup {
  position: fixed; inset: 0; z-index: 2000;
  background: var(--bg, #fff);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
#setup[hidden] { display: none; }
.setup-card {
  max-width: 420px; width: 100%;
  background: var(--chrome, #fff);
  border-radius: 20px;
  padding: 34px 30px;
  text-align: center;
  box-shadow: 0 12px 48px rgba(0,0,0,.16);
}
.setup-card img { width: 64px; height: 64px; margin-bottom: 14px; }
.setup-card h2 { font-size: 20px; font-weight: 500; margin: 0 0 10px; color: var(--text, #202124); }
.setup-lead { font-size: 14px; line-height: 1.55; color: var(--omni-sub, #5f6368); margin: 0 0 22px; }
#setup-url {
  width: 100%; box-sizing: border-box;
  padding: 13px 16px; font-size: 15px;
  border-radius: 12px;
  border: 1px solid var(--br, #dadce0);
  background: var(--field, #f1f3f4);
  color: var(--text, #202124);
  outline: none; margin-bottom: 14px;
}
#setup-url:focus { border-color: #0fa895; }
#setup-connect { width: 100%; padding: 13px; font-size: 15px; border: 0; margin-bottom: 6px; }
#setup-msg { min-height: 20px; font-size: 13px; color: var(--danger, #d93025); margin-bottom: 4px; }
.setup-hint { font-size: 12px; line-height: 1.5; color: var(--omni-sub, #5f6368); margin: 6px 0 0; }
.setup-hint code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; background: var(--field, #f1f3f4); padding: 1px 5px; border-radius: 5px; }

</style>
</head>
<body>
<div id="app" data-theme="system">

  <!-- ======= TOP CHROME (the only chrome — nothing at the bottom) ======= -->
  <header id="browser">

    <!-- Tab strip -->
    <div id="tabstrip">
      <div id="tabs" role="tablist" aria-label="Tabs"></div>
      <button id="newtab-btn" class="strip-btn" title="New tab (Ctrl+T)" aria-label="New tab">
        <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
      </button>
    </div>

    <!-- Toolbar (v6: no back/forward buttons — the phone's back
         button drives navigation; tabs and menu swapped) -->
    <div id="toolbar">
      <button id="btn-reload" class="tb-btn" title="Reload (Ctrl+R)" aria-label="Reload">
        <svg viewBox="0 0 24 24" class="ic-reload"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
      <button id="btn-home" class="tb-btn" title="Home" aria-label="Home" hidden>
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      </button>

      <!-- Omnibox -->
      <div id="omnibox" class="">
        <div id="omni-left">
          <svg id="omni-lock" viewBox="0 0 24 24" title="Secure"><path d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-6 9a2 2 0 1 1 2-2 2 2 0 0 1-2 2zm3-9H9V6a3 3 0 0 1 6 0z"/></svg>
          <svg id="omni-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        </div>
        <input id="omnibox-input" type="text" spellcheck="false" autocomplete="off"
               placeholder="Search or type URL" aria-label="Search or type URL">
        <button id="omni-clear" title="Clear" aria-label="Clear" hidden>
          <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <button id="omni-star" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark">
          <svg viewBox="0 0 24 24"><path d="m12 17.27 6.18 3.73-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </button>
        <div id="suggest" role="listbox" aria-label="Suggestions" hidden></div>
      </div>

      <!-- Tabs button — BEFORE the menu (v6: swapped with 3-dots) -->
      <button id="btn-tabs" class="tb-btn" title="Switch tabs" aria-label="Open tab switcher" hidden>
        <svg viewBox="0 0 24 24"><path d="M21 5H7a2 2 0 0 0-2 2v1H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-3 13H4v-8h14zm3-3h-1V9a2 2 0 0 0-2-2H7V7h14z"/></svg>
        <span id="tabs-badge">1</span>
      </button>

      <button id="btn-menu" class="tb-btn" title="Menu" aria-label="Menu" aria-haspopup="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
    </div>

    <div id="progressbar"><i></i></div>
  </header>

  <!-- ======= PAGE VIEWPORT ======= -->
  <main id="viewport"></main>

  <!-- ======= Overlays (all anchored to the TOP — no bottom bars) ======= -->
  <div id="menu" hidden></div>

  <div id="findbar" hidden>
    <input id="find-input" type="text" placeholder="Find in page" spellcheck="false" aria-label="Find in page">
    <span id="find-count">0/0</span>
    <button id="find-prev" title="Previous" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M7.41 15.41 12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg></button>
    <button id="find-next" title="Next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></button>
    <button id="find-close" title="Close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
  </div>

  <!-- Tab switcher overlay (v6: simple 2-column grid, X per cell,
       larger + top-right, close-all) -->
  <div id="tabgrid" hidden>
    <div class="tg-head">
      <span id="tg-count">Tabs</span>
      <span class="tg-spacer"></span>
      <button id="tg-close-all" class="tg-btn">Close all</button>
      <button id="tg-new" class="tg-new" title="New tab" aria-label="New tab">
        <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
      </button>
    </div>
    <div id="tg-list"></div>
  </div>

  <!-- Dialogs -->
  <dialog id="dlg">
    <h3 id="dlg-title"></h3>
    <div id="dlg-body"></div>
    <div id="dlg-actions">
      <button id="dlg-cancel" class="btn-ghost">Cancel</button>
      <button id="dlg-ok" class="btn-primary">OK</button>
    </div>
  </dialog>

  <!-- Downloads progress (v6) -->
  <div id="dlbar" hidden></div>

  <div id="toast" hidden></div>

  <!-- First-run setup: connect this file to your worker -->
  <div id="setup" hidden>
    <div class="setup-card">
      <img id="setup-logo" alt="Superwork">
      <h2>Connect to your worker</h2>
      <p class="setup-lead">This file is the Superwork browser. It loads sites through your own Cloudflare Worker — paste its URL below.</p>
      <input id="setup-url" type="text" inputmode="url" spellcheck="false" autocomplete="off"
             placeholder="https://superwork.yourname.workers.dev" aria-label="Worker URL">
      <button id="setup-connect" class="btn-primary">Connect</button>
      <div id="setup-msg" role="alert"></div>
      <p class="setup-hint">Find it in the Cloudflare dashboard under Workers &amp; Pages, or run <code>npx wrangler deploy</code> and copy the URL it prints.</p>
    </div>
  </div>
</div>

<script>
/* ============================================================
   Superwork 6.0 — Browser UI (Chrome-style, top bar only)
   Standalone single-file client for a pure-API Cloudflare Worker.
   ------------------------------------------------------------
   v5 "zero navigation": pages are fetched via API calls and
   rendered in sandboxed srcdoc iframes — the browser never
   makes a navigation request, so networks that only allow
   API traffic still work.
   v6: full download pipeline (native save + re-save store),
   on-open search setting, simplified 2-column tab grid, and
   the phone's back button replaces the on-screen back/fwd.
   ============================================================ */
'use strict';

(function () {
  const APP_VERSION = '8.0.0';
  const PREFIX = '/service/';
  const LS = {
    engine: 'superwork:engine', engines: 'superwork:customEngines', settings: 'superwork:settings',
    tabs: 'superwork:tabs', history: 'superwork:history', bookmarks: 'superwork:bookmarks',
    links: 'superwork:quicklinks', welcome: 'superwork:welcomeDone',
    downloads: 'superwork:downloads'
  };

  /* ============================================================
     Connection
     ------------------------------------------------------------
     This file renders every site through your Cloudflare Worker
     (a pure API proxy) inside a sandboxed iframe — no service
     worker, no same-origin requirements, works from file://.
     The worker URL is user-configured and stored in localStorage.
     ============================================================ */
  const LS_WORKER = 'superwork:worker';
  const LS_JAR = 'superwork:jar';
  const LS_DSK = 'superwork:desktopHosts';
  const ICON = 'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20128%20128%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%230fa895%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230b8f7e%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20x%3D%226%22%20y%3D%226%22%20width%3D%22116%22%20height%3D%22116%22%20rx%3D%2228%22%20fill%3D%22url(%23g)%22%2F%3E%3Cpath%20d%3D%22M84.5%2045.8c-3.2-6.4-10.9-11-20.5-11-13%200-23%207.9-23%2019.2%200%2010.6%208.4%2016.3%2020.9%2019.5%2010.6%202.7%2014.2%205.2%2014.2%2010%200%205.4-5%208.9-12.6%208.9-8.2%200-14.9-3.6-18.3-10.4L32%2089.6c4.4%208.7%2013.6%2014.6%2026.2%2014.6h2.6c14.5%200%2025.3-7.8%2025.3-20.6%200-11.4-8.1-17-21.9-20.7-11.6-3.1-13.9-5.6-13.9-9.6%200-4.4%204.4-7.4%2011.3-7.4%206.6%200%2011.8%202.9%2014.7%208.3z%22%20fill%3D%22%23ffffff%22%2F%3E%3C%2Fsvg%3E';
  let WORKER = '';                  /* worker origin, set at connect */

  function normalizeWorkerUrl(u) {
    let s = (u || '').trim();
    if (!s) return '';
    if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
    return s.replace(/\/+$/, '');
  }
  function savedWorker() {
    return normalizeWorkerUrl(localStorage.getItem(LS_WORKER) || '');
  }
  async function testWorker(origin) {
    /* v8: hard timeout — a busy or half-dead worker must never hang
       the boot sequence (the app used to sit with an empty viewport
       forever when the worker accepted the connection but stalled) */
    try {
      const ctrl = new AbortController();
      const tm = setTimeout(() => { try { ctrl.abort(); } catch (e) { } }, 10000);
      const r = await fetch(origin + '/', { cache: 'no-store', signal: ctrl.signal });
      clearTimeout(tm);
      if (!r.ok) return null;
      const j = await r.json();
      return (j && j.service === 'superwork') ? j : null;
    } catch (e) { return null; }
  }
  /* absolute (or same-origin relative) URL for a /service/ path */
  function svc(path) { return WORKER + path; }

  /* ---------------- proxy cookie jar (iframe-mode persistence) ------
     The worker keeps the live jar; this local copy preserves logins
     across worker cold starts and app restarts, and is pushed to the
     worker before every navigation. */
  let jarTimer = null;
  function cookieName(line) { try { return (line || '').split('=')[0].trim(); } catch (e) { return ''; } }
  function jarLoad() { try { const v = JSON.parse(localStorage.getItem(LS_JAR) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
  function jarSave(list) { try { localStorage.setItem(LS_JAR, JSON.stringify(list.slice(-800))); } catch (e) { } }
  function jarMerge(list) {
    const map = new Map();
    for (const it of jarLoad()) map.set(it.u + '\n' + cookieName(it.c), it);
    for (const it of (list || [])) map.set(it.u + '\n' + cookieName(it.c), it);
    const out = [...map.values()];
    jarSave(out);
    return out;
  }
  function jarAdd(u, c) { jarMerge([{ u, c }]); }
  function desktopHosts() {
    try { const v = JSON.parse(localStorage.getItem(LS_DSK) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
  function syncJar(extra) {
    if (!WORKER) return Promise.resolve();
    return fetch(WORKER + '/jar', {
      method: 'POST',
      headers: { 'content-type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({

     hook mirrors writes here ("sw:<tag>:<origin>:" keys) and we
     send the snapshot back through the x-sw-store header so the
     worker can seed the next page load. sessionStorage is kept
     in memory for the app session. */
  const memSS = {};

      const ob = b64e(new URL(url).origin);
      const out = { ls: {}, ss: {} };
      const pre = 'sw:ls:' + ob + ':';
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf(pre) === 0) out.ls[k.slice(pre.length)] = localStorage.getItem(k);
      }
      const ss = memSS[ob] || {};
      Object.keys(ss).forEach(k => { out.ss[k] = ss[k]; });
      if (!Object.keys(out.ls).length && !Object.keys(out.ss).length) return null;
      const payload = b64e(JSON.stringify(out));

     Downloads (v6) — every download is fetched through the worker
     as a plain API request, streamed into a Blob, then handed to
     the browser's REAL download manager via a blob: <a download>
     (native "save to device" on the phone, the moment it
     finishes). The last 5 files are kept — metadata in
     localStorage, blobs in IndexedDB when available, otherwise in
     memory for the session — so any of them can be saved again
     from Settings → Downloads.
     ============================================================ */

  const dlMem = new Map();     /* session fallback for blobs */

  function dlIdbInit() {
    return new Promise((resolve) => {
      let settled = false;
      const done = (v) => { if (!settled) { settled = true; resolve(v); } };
      try {
        const req = indexedDB.open('superwork-dl', 1);
        req.onupgradeneeded = () => { try { req.result.createObjectStore('files'); } catch (e) { } };
        req.onsuccess = () => { dlIdb = req.result; done(true); };
        req.onerror = () => done(false);

      dlIdb.transaction('files', 'readwrite').objectStore('files').put(blob, id);
    } catch (e) { }
  }
  function dlBlobGet(id) {
    return new Promise((resolve) => {
      if (dlMem.has(id)) { resolve(dlMem.get(id)); return; }
      if (!dlIdb) { resolve(null); return; }
      try {
        const rq = dlIdb.transaction('files', 'readonly').objectStore('files').get(id);
        rq.onsuccess = () => resolve(rq.result || null);
        rq.onerror = () => resolve(null);
      } catch (e) { resolve(null); }
    });
  }
  function dlBlobDel(id) {
    dlMem.delete(id);
    if (!dlIdb) return;
    try { dlIdb.transaction('files', 'readwrite').objectStore('files').delete(id); } catch (e) { }
  }
  function dlMeta() { return loadJSON(LS.downloads, []); }
  function dlMetaSave(list) { saveJSON(LS.downloads, list.slice(-DL_MAX)); }

    let list = dlMeta().filter(x => x.id !== item.id);
    list.push(item);

  function fmtSize(n) {
    n = Number(n);
    if (!isFinite(n)) return '';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
    return (n / 1073741824).toFixed(2) + ' GB';

    if (m) {
      try {
        const v = m[1].trim().replace(/^utf-8/i, '').replace(/^''/, '');
        return decodeURIComponent(v);
      } catch (e) { }
    }
    m = /filename\s*=\s*"([^"]*)"|filename\s*=\s*([^;]+)/i.exec(cd);
    if (m) return (m[1] !== undefined ? m[1] : m[2]).trim().replace(/^\.+/, '');

  const MIME_EXT = {

    'application/gzip': '.gz', 'application/x-tar': '.tar', 'application/octet-stream': '.bin',
    'application/json': '.json', 'text/plain': '.txt', 'text/csv': '.csv', 'text/html': '.html',
    'image/png': '.png', 'image/jpeg': '.jpg', 'image/gif': '.gif', 'image/webp': '.webp',
    'image/svg+xml': '.svg', 'audio/mpeg': '.mp3', 'audio/ogg': '.ogg', 'audio/wav': '.wav',
    'video/mp4': '.mp4', 'video/webm': '.webm', 'application/vnd.rar': '.rar',
    'application/x-7z-compressed': '.7z', 'application/epub+zip': '.epub'
  };

    name = String(name || 'download');
    if (/\.[a-z0-9]{1,5}$/i.test(name)) return name;
    const ext = MIME_EXT[(mime || '').split(';')[0].trim().toLowerCase()];
    return ext ? name + ext : name;

  /* ============================================================
     v7: native Save-As. Where the File System Access API is
     available (Chrome), showSaveFilePicker() opens the REAL
     folder chooser — "which folder on my phone". Long downloads
     outlast the browser's transient-activation window, so when
     the picker cannot open directly a small prompt re-acquires a
     tap and the picker opens from it. Engines without the picker
     fall back to the blob <a download> push (the phone's download

     Settings → Downloads can re-save (also via the picker).
     ============================================================ */

    try {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');

      a.rel = 'noopener';
      a.style.position = 'fixed';

      await w.close();

  function saveAsPrompt(name) {
    return new Promise((resolve) => {
      const p = el('div', 'saveas');
      const card = el('div', 'saveas-card');
      card.appendChild(el('div', 'saveas-title', 'Download complete'));
      card.appendChild(el('div', 'saveas-name', esc(name || 'download')));
      card.appendChild(el('div', 'saveas-sub', 'Choose where to save this file on your device.'));
      const pick = el('button', 'btn-primary saveas-btn', 'Choose folder…');
      const dl = el('button', 'btn-ghost saveas-btn', 'Save to Downloads');
      const later = el('button', 'btn-ghost saveas-btn', 'Keep for later');
      card.append(pick, dl, later);
      p.appendChild(card);
      const done = (v) => { try { p.remove(); } catch (e) { } resolve(v); };

  /* stream a fetched response into a blob, save natively + store */
  function pumpDownload(r, url, name, card, ctrl) {
    const cd = r.headers.get('content-disposition') || '';
    const type = (r.headers.get('content-type') || '').split(';')[0].trim() || 'application/octet-stream';
    const nm = name || withMimeExt(cdFilename(cd) || urlBasename(url) || 'download', type);
    const len = parseInt(r.headers.get('x-sw-len') || r.headers.get('content-length') || '0', 10);
    card.setName(nm);
    const finish = (data) => {
      const blob = data instanceof Blob ? data : new Blob(data, { type });
      const id = 'dl' + Date.now() + Math.floor(Math.random() * 1e4);
      dlBlobPut(id, blob);             /* keep for re-saving */
      dlAddMeta({ id, name: nm, mime: type, size: blob.size, url: url, ts: Date.now() });
      if (tab() && tab().internal === 'settings') refreshDownloadsSection();
      /* v7: native Save-As — the picker opens the moment the file
         completes (a fresh tap is requested if the activation
         window expired mid-download) */
      if (canPick) {
        card.set(100, 'Choosing where to save…');
        nativeSave(blob, nm).then((ok) => {
          if (ok) card.done('Saved · ' + fmtSize(blob.size));
          else card.done('Kept — re-save from Settings');
        });
      } else {
        nativeSave(blob, nm);          /* push to the phone right now */
        card.done('Saved · ' + fmtSize(blob.size));
      }
    };
    if (!r.body || typeof r.body.getReader !== 'function') {
      return r.blob().then(finish);
    }
    const reader = r.body.getReader();
    const chunks = [];
    let recv = 0;
    let cancelled = false;
    /* loadTab-classified downloads have no AbortController — the
       card's X cancels the stream reader directly */
    if (!ctrl) card.onCancel(function () {
      cancelled = true;
      try { reader.cancel(); } catch (e) { }
      card.fail('Cancelled');
    });
    const pump = () => reader.read().then((step) => {
      if (cancelled) return;
      if (step.done) { finish(chunks); return; }
      chunks.push(step.value);
      recv += step.value.byteLength;
      if (len > 0) card.set(recv / len * 100, fmtSize(recv) + ' of ' + fmtSize(len));
      else card.set(null, fmtSize(recv) + ' downloaded…');
      return pump();
    });
    return pump().catch((err) => {
      if (ctrl && ctrl.signal && ctrl.signal.aborted) { card.fail('Cancelled'); return; }
      card.fail('Failed — ' + String((err && err.message) || err).slice(0, 60));
    });
  }
